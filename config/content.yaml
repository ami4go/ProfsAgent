# Phase 2 deliverable B (lecture content): settings read by src/profsagent/content/.
# Slide pacing follows common lecture practice: about 2-3 minutes per content slide, i.e. 8-14 content slides per hour,
# plus the title, objectives and references slides that code adds.
classes:                                   # how the week's lecture hours are taught: one deck per class (content/sessions.py)
  per_week: 2                              # IIIT-D: L = 3 is taught as 2 classes a week
  minutes: 90                              # 2 x 90 min = the 3 lecture hours (Parth, 2026-10-28; some courses use 80)
deck:
  slides_per_hour: {min: 8, max: 14}       # content slides the AI writes (B1), per lecture hour (depth "standard")
  slides_per_hour_by_depth:                # the same at the other depths; the professor's --slides overrides all of them
    basic: {min: 6, max: 10}
    high: {min: 14, max: 20}
  depth: standard                          # content depth when the professor does not say (--depth basic|standard|high)
  max_bullets: 6                           # D-DENSE warning above this per slide
  max_bullet_words: 22                     # D-DENSE warning above this per bullet
  minutes_tolerance: 0.2                   # D-TIME warning when the slides' minutes differ from the lecture by more
  repair_rounds: 1                         # extra B1 calls when the deck has errors (kept only if errors drop)
  mode: per_slide                          # per_slide: B7 plans the deck (checked by code), B8 writes each slide in its
                                           # own call, faults are repaired on their own slide (content/plan.py; about
                                           # 2 + slides calls). deck: B1 writes the whole deck in one call
  plan_repair_rounds: 1                    # extra B7 calls when the plan has problems (kept only if they drop)
  slide_repair_rounds: 2                   # rounds of rewriting the slides that still have errors
verify:
  grounding_floor: 0.35                    # D-GROUND when a cited source's similarity to the slide is below both this and
                                           # the slide's median over all offered sources. Calibrated on cs601-02 W01.L1
                                           # (titles only): cited median 0.38, uncited 0.28; flags 4 of 29 citations
sources:
  include_pending: false                   # cite C's resources only once the professor approved them (review.yaml)
  max_external: 8                          # C items offered to B1 as sources, best-ranked first
render:
  width_in: 13.333                         # 16:9
  height_in: 7.5
  font: Calibri
  mono_font: Consolas
  colors: {ink: "1F2937", muted: "6B7280", accent: "0F766E", accent_soft: "CCFBF1", panel: "F3F4F6", code_bg: "111827",
           code_ink: "E5E7EB"}
example:                                   # content/example.py: the running example, its numbers computed by code (B6)
  enabled: true                            # one more AI call per deck (two when its code fails once)
  repair_rounds: 2                         # B6 is asked again with the error when its code does not run
  timeout_s: 20                            # the example's code runs in its own Python process for at most this long
  max_values: 80
html:                                      # content/slides_html.py: slides.html + slides.pdf with typeset maths (KaTeX)
  measure: true                            # open the deck in Chrome (Playwright) during the checks and the render: measured
                                           # overflow and maths errors go back to B1 (false: no PDF, maths as LaTeX in .pptx)
  browser: chrome                          # Playwright channel: the installed Chrome
  min_scale: 0.8                           # a slide's text shrinks in 5% steps down to this before it counts as overflowing
  timeout_s: 60
narration:                                 # content/narrate.py: run_content.py narrate (Windows + PowerPoint)
  engine: piper                            # piper (offline neural voice) | windows; piper falls back to windows if missing
  piper_model: data/voices/en_US-lessac-medium.onnx   # python -m piper.download_voices --download-dir data/voices <voice>
  voice: Microsoft Zira Desktop            # the Windows voice (Settings -> Time & language -> Speech adds more)
  rate: 0                                  # -10 (slow) .. 10 (fast)
  sample_rate: 16000                       # Hz, mono 16-bit: about 1.9 MB a minute
  gap_s: 1.0                               # silence after each slide's audio before the next slide
  video: {height: 720, fps: 24, quality: 70, timeout_s: 1800}
attach:                                    # content/attach.py: the professor's own material (survey attach_material)
  max_chars: 24000                         # material text given to the AI (B3) and to B1 for the slides task; the rest is cut
  coverage: {covered: 0.5, partly: 0.35}   # local-model similarity of an outcome to its closest ~120-word passage
                                           # (a topical hint, not calibrated; the AI's gap check decides, A-GAP flags conflicts)
lesson:                                    # content/lesson.py: a class taught as 3-4 video parts (run_content.py teach)
  parts: {min: 3, max: 4}
  minutes: 40                              # video minutes planned for the class (8-12 per part)
  slides: {min: 5, max: 8}                 # teaching slides per part (plus its title, recap, quiz and answer slides)
  narration_words: {min: 110, max: 260}    # spoken teaching per slide; below min is L-NARRATION (too little to teach)
  words_per_minute: 150
  copy_ngram: 12                           # L-COPY: this many words in a row copied from a reference passage
  plan_passages: 14                        # reference passages given to the plan (B4)
  part_passages: 8                         # and to each part (B5)
  spread_passages: true                    # a later part prefers passages the earlier parts did not use
  max_pages: 10                            # an index page of a web reference: pages under it that are read
