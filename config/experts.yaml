# Phase 2 · Deliverable C — expert-speaker recommender (plan §4). Global scope: research or industry.

top_n: {min: 5, max: 7}      # decided 2026-10-24: 5–7 experts per lecture
eligibility:                # same bar for everyone (IIIT-D faculty included): only good matches are recommended
  min_topical_fit: 0.5      # evidence must be clearly about this lecture's topic
  min_total: 0.45
  allowed_fit: [strong, moderate]   # AI fit check (D4)
weights:                    # §4.3 (practical relevance shifts up for hands-on lectures, see hands_on_shift)
  topical_fit: 0.35
  teaching: 0.20
  practical: 0.15
  standing: 0.10
  recency: 0.10
  feasibility: 0.10
hands_on_shift: 0.05        # moved from standing to practical when the lecture is hands-on

openalex:
  works_per_query: 50       # topic works scanned to find who works on the lecture's topics
  india_query: true         # a second search restricted to authors at Indian institutions (IITs, IISc, IIITs, ...)
  min_year: 2012
  authors_to_profile: 18    # top authors fetched in full (singleton lookups are free)
dblp: {enabled: true}
scholar:                    # Google Scholar through SerpApi (SERPAPI_API_KEY, free plan 250 searches/month; 2026-11-01)
  enabled: true
  search_per_lecture: true  # one Scholar paper search per lecture: more academics, each with a profile id
  profiles_per_lecture: 8   # Scholar profiles read (1 search each) for the best-scoring academics (not IIIT-D faculty)
  max_searches_per_lecture: 10   # all SerpApi searches of one lecture (search + profiles + name look-ups)
  keep_searches: 10         # stop using SerpApi when fewer than this are left this month (Semantic Scholar instead)
  semantic_scholar_fallback: true   # keyless Semantic Scholar for affiliation / h-index when Scholar has no profile
record:
  min_h_index: 5            # academics (not IIIT-D faculty) whose best h-index on any source is lower are not shown
                            # (28 Oct run: 15 of 49 academics shown had h-index 0–1, mostly one-paper authors)
weak_identity_domains: [scribd.com, slideshare.net, pdfcoffee.com, dokumen.pub, studocu.com, coursehero.com, issuu.com]
                            # document-sharing sites: a name on them does not confirm who someone is
github:
  enabled: true
  repos_per_query: 8
web_search:
  enabled: true             # grounded search for practitioners (public professional pages only)
  max_queries: 2

# Standing: authors at these institutions get a prestige credit (top global universities from config/institutions.yaml
# are added automatically). Substring match on the OpenAlex institution name.
top_institutions_extra: [Indian Institute of Technology, Indian Institute of Science, International Institute of Information Technology,
  Indraprastha Institute of Information Technology, Tata Institute of Fundamental Research, Chennai Mathematical Institute,
  Indian Statistical Institute, Massachusetts Institute of Technology, Stanford, Carnegie Mellon, University of California,
  Max Planck, INRIA, University of Tokyo, Tsinghua, Peking University, National University of Singapore, KAIST, EPFL, ETH]

diversity:
  min_industry: 1           # at least one practitioner when any is found
  min_academic: 1
  max_same_country: 3
  max_same_affiliation: 1   # one person per university / company (28 Oct run: 3 from Kalyani, 3 from Télécom Paris)
  one_per_paper: true       # co-authors of the same paper are one slot, not several
  iiitd_first: 2            # IIIT-D faculty the AI check (D4) calls a strong fit are listed first (at most this many)

feasibility:                # time-zone overlap with IST working hours (UTC+5:30)
  country_utc_offset:       # rough offsets; unknown countries are treated as neutral
    IN: 5.5
    US: -6
    CA: -5
    GB: 0
    IE: 0
    DE: 1
    FR: 1
    CH: 1
    NL: 1
    SE: 1
    IT: 1
    ES: 1
    SG: 8
    CN: 8
    HK: 8
    JP: 9
    KR: 9
    AU: 10
    NZ: 12
    IL: 2
    AE: 4
    BR: -3
  india_bonus: 0.2          # Indian / IIIT-D experts get this bonus on feasibility (travel, language, schedule)

privacy:
  store_fields: [name, affiliation, country, role, profile_url, openalex_id, orcid, dblp_url, github_url, scholar_search_url]
  never_store: [email, phone, home address, personal social media]
