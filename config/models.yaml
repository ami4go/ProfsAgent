# LLM routing. Each role lists endpoints in preference order; the client walks the list, and for Gemini
# models tries every key in GEMINI_API_KEYS before moving on. Cooldowns are persisted in data/cache/llm_state.json.
#
# FREE-TIER FACTS (measured 2026-09-30):
#   Gemini: 20 requests / day / PROJECT / model (GenerateRequestsPerDayPerProjectPerModel-FreeTier = 20).
#           Keys from the SAME Google Cloud project share that quota — use keys from different projects.
#           3.x flash models return frequent 503 "high demand"; overload is model-wide, so a 503 cools the model on all keys.
#           Google-Search grounding works on 2.5-flash only (3.x grounding quota = 0).
#   Groq:   1000 requests / day / model, 8000 tokens / minute / model → a single request must stay < ~8K tokens.
#   Other free OpenAI-compatible providers (checked 2026-10-28; keys optional, a provider without keys is skipped):
#   Mistral (La Plateforme, Free plan): ~1 request/s, monthly credit; phone verification, no card. MISTRAL_API_KEYS
#   NVIDIA NIM (build.nvidia.com): free, ~40 requests/min per account, no daily cap published; phone verification.
#           NVIDIA_API_KEYS (3 keys). Checked 2026-10-28: nemotron-3-ultra-550b, minimax-m3.1-flash,
#           nemotron-3.5-lightning answer in 1-5 s (step-5-preview gives empty JSON); deepseek-v4.1-flash, glm-5.3, gemma-4-31b, gpt-oss-20b hung > 90 s;
#           kimi-k2.6 and several older models are "not found for account"; gpt-oss-120b retired 2026-09-03.
#   OpenRouter ":free" models: 20 requests/min, 50 requests/DAY in total (1000/day after a one-time $10 top-up).
#           The free roster changes often: run scripts/check_llm.py to see which configured models answer.  OPENROUTER_API_KEYS
#   Not used: Cerebras (now a $5 trial that needs a card), GitHub Models (reported retired 2026-07-30).
#   Ollama: local gemma4 (8B Q4) ~10 tok/s, qwen3.5:9b ~7 tok/s on this CPU (no GPU) — last resort only.
providers:             # OpenAI-compatible chat endpoints besides Groq; several comma-separated keys per variable are fine
  mistral:    {base_url: "https://api.mistral.ai/v1", keys_env: MISTRAL_API_KEYS, min_interval_s: 1.2}
  nvidia:     {base_url: "https://integrate.api.nvidia.com/v1", keys_env: NVIDIA_API_KEYS, min_interval_s: 1.6, max_tokens: 8192,
               timeout_s: 240}  # 40 RPM. Was 75 s (some NIM models hang; those are no longer listed), which is too short for
                                # a lecture deck: ~7.5K output tokens take 2-3 min, so every B1/B2 call timed out (2026-10-28)
  openrouter: {base_url: "https://openrouter.ai/api/v1", keys_env: OPENROUTER_API_KEYS, min_interval_s: 3.5,
               headers: {X-Title: ProfsAgent}}
roles:
  generate:            # G1–G11, R1, X1, D2, D4: Gemini -> NVIDIA -> Groq gpt-oss -> the rest (user's order, 2026-10-28)
    - {provider: gemini, model: gemini-3.8-flash}
    - {provider: gemini, model: gemini-3.7-flash}
    - {provider: gemini, model: gemini-3.5-flash}
    - {provider: gemini, model: gemini-2.5-flash}
    - {provider: nvidia, model: nvidia/nemotron-3-ultra-550b-a55b}
    - {provider: nvidia, model: minimaxai/minimax-m3.1-flash}
    - {provider: groq,   model: openai/gpt-oss-120b, max_prompt_tokens: 5500}
    - {provider: gemini, model: gemini-3.5-flash-lite}
    - {provider: gemini, model: gemini-3.1-flash-lite}
    - {provider: gemini, model: gemini-flash-lite-latest}
    - {provider: groq,   model: qwen/qwen3.8-27b, max_prompt_tokens: 5500}
    - {provider: mistral, model: mistral-large-latest}
    - {provider: openrouter, model: "nvidia/nemotron-3.5-super-vl:free"}
    - {provider: openrouter, model: "google/gemma-4-31b-it:free"}
    - {provider: ollama, model: "gemma4:latest"}      # LOCAL last resort (CPU, ~10 tok/s): minutes per call, no quota
    - {provider: ollama, model: "qwen3.5:9b"}
  extract:             # X2 page reading, X3/D1 queries: Gemini -> NVIDIA -> Groq gpt-oss -> the rest
    - {provider: gemini, model: gemini-3.7-flash}
    - {provider: gemini, model: gemini-3.5-flash}       # second strong model, so PROFSAGENT_STRONG_ONLY runs are not left with one
    - {provider: gemini, model: gemini-3.5-flash-lite}
    - {provider: gemini, model: gemini-3.1-flash-lite}
    - {provider: nvidia, model: minimaxai/minimax-m3.1-flash}
    - {provider: nvidia, model: nvidia/nemotron-3.5-lightning-30b-a3b}
    - {provider: nvidia, model: nvidia/nemotron-3-ultra-550b-a55b}
    - {provider: groq,   model: openai/gpt-oss-120b, max_prompt_tokens: 5500}
    - {provider: groq,   model: openai/gpt-oss-20b, max_prompt_tokens: 5500}
    - {provider: groq,   model: qwen/qwen3.8-27b, max_prompt_tokens: 5500}
    - {provider: mistral, model: mistral-small-latest}
    - {provider: openrouter, model: "nvidia/nemotron-3.5-super-vl:free"}
    - {provider: ollama, model: "gemma4:latest"}
    - {provider: ollama, model: "qwen3.5:9b"}
  search:              # Google-Search grounding: free tier only works on 2.5-flash (3.x grounding quota = 0)
    - {provider: gemini, model: gemini-2.5-flash}
  check:               # the LLM check of the llm validation profile (config/llm_check.yaml): a different model
                       # order from `generate`, so the generator's first-choice model is not the first checker.
                       # gemini-2.5-flash removed: "404 model unsupported" on every key (21 Oct 2026)
    - {provider: gemini, model: gemini-3.7-flash}
    - {provider: gemini, model: gemini-3.5-flash}
    - {provider: groq,   model: openai/gpt-oss-120b, max_prompt_tokens: 6500}
    - {provider: gemini, model: gemini-3.8-flash}
    - {provider: gemini, model: gemini-3.1-flash-lite}
  review:              # B2 AI review of a lecture deck (content/ai_review.py). The deck's own generator model is excluded
                       # per call, so the reviewer is always a different model; this order only says which one comes first
    - {provider: gemini, model: gemini-3.7-flash}
    - {provider: gemini, model: gemini-3.5-flash}
    - {provider: gemini, model: gemini-3.8-flash}
    - {provider: nvidia, model: nvidia/nemotron-3-ultra-550b-a55b}
    - {provider: groq,   model: openai/gpt-oss-120b, max_prompt_tokens: 6500}
    - {provider: nvidia, model: minimaxai/minimax-m3.1-flash}
  # Stage 5 judge panel (config/judging.yaml): ONE model per judge, so a judge never silently becomes another model;
  # a judge with no key or no quota is reported missing. judge_c needs a Groq key (GROQ_API_KEYS); none is set now.
  judge_a:             # was gemini-2.5-flash ("404 model unsupported" on every key, 21 Oct 2026)
    - {provider: gemini, model: gemini-3.5-flash}
  judge_b:
    - {provider: gemini, model: gemini-3.7-flash}
  judge_c:             # a J1 prompt is ~6K tokens (rubrics + design) + ~1.5K output: inside Groq's 8K tokens/minute
    - {provider: groq,   model: openai/gpt-oss-120b, max_prompt_tokens: 6500}
  judge_d:
    - {provider: gemini, model: gemini-3.5-flash-lite}
embedding:
  model: gemini-embedding-001
  dim: 768
cache:
  enabled: true        # DEV ONLY: identical (prompt, inputs, role) → cached output. Disable for repeated-sampling experiments.
limits:
  min_interval_s: 4.0        # per (key, model) client-side spacing
  timeout_s: 180
  cooldown_503_s: 120        # applied to the MODEL on all keys
  cooldown_timeout_s: 60
  cooldown_429_default_s: 65
  schema_retries: 1          # re-ask once with the Pydantic error appended
  schema_fallback_models: 2  # still invalid after that: skip the model for this call and try up to 2 more in the role
  native_json_schema: false  # send the Pydantic JSON Schema to Gemini (responseJsonSchema, constrained decoding);
                             # off until a live call confirms the models accept it (a rejected schema falls back to plain JSON)
  max_wait_s: 600            # when every slot is cooling down, wait up to this long for the soonest
  repair_stall_rounds: 2     # stop R1 after this many rejected patches in a row (each round is one call)
  regenerate_on_stall: 0     # 1: when repair stalls with errors left that R1 could fix, call the generator once more with
                             # the open errors as evidence; kept only if it has fewer errors. Off: it costs a call per stage
  ollama_timeout_s: 2400
