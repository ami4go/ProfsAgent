# Phase 2 · Deliverable C — learning-resource recommender (docs/03_phase2_C_learning_resources_and_experts_plan.md §3)
# Everything here is tunable; weights are applied as given (they sum to 1).

caps:                       # per lecture, shown to the professor (more stay in reserve for "replace")
  videos: 3
  readings: 2
  practice: 1
  recorded_lecture: 1        # full-length lecture for a flipped class
  reserve: 4                 # extra ranked candidates kept per kind for replacements
  min_show_score: 0.60       # quality floor: show fewer items rather than weak ones (they stay out of the list)
  min_continuation_score: 0.62   # next-best items for a later lecture on the same topic must also cover that topic

weights:                    # §3.4
  coverage: 0.35
  quality: 0.20
  authority: 0.15
  level_fit: 0.10
  reception: 0.10
  practicality: 0.10

free_only: true             # decided 2026-10-24: no paid MOOCs or paywalled books

# Components (2026-11-01): each topic's lecture time is split into components (what must be taught, for how long), and
# each component is delivered by verified video segments, by a NotebookLM video the professor makes, or in class.
components:
  min_minutes: 5            # no component shorter than this
  max_minutes: 30           # nor longer (split it)
  target_minutes: 15        # typical length: n components ≈ lecture minutes / this
  round_to: 5               # minutes are whole multiples of this
  in_class_kinds: [activity, discussion]   # taught live with the slides, never assigned a video

# Videos for a lecture (decided 10 Nov, docs/decisions.md 38): find -> filter on metadata -> captions for a shortlist -> AI reads
# which parts each video teaches and where -> a second AI checks each clip -> one plan for the lecture. Nothing else is suggested.
videos:
  # finding
  part_web_search: true       # every part gets a DuckDuckGo video search (no YouTube quota)
  series_max_playlists: 3     # playlists of tier 1-2 channels opened per topic (1 unit each; the playlist search is 100 units)
  series_videos_per_lecture: 4   # lectures of those series kept, by how well their titles match the lecture's parts
  series_min_sim: 0.35        # title similarity they need
  series_bonus: 0.12          # shortlist and reading: a university lecture is preferred over a similar-looking web result
  part_searches_per_lecture: 2   # YouTube searches (100 units) for parts still without a checked clip, longest first
  skip_titles: "#shorts|\\bshorts\\b|\\btrailer\\b|\\bteaser\\b|\\bpromo\\b|\\breaction\\b|course overview|course introduction"
  # shortlist (metadata only; transcripts are the scarce resource: 40 new ones an hour)
  transcripts_per_lecture: 6  # new transcripts a lecture may ask for; ones already cached do not count
  max_shortlist: 12           # videos with a transcript a lecture looks at
  transcripts_per_part_search: 2
  # notes instead of captions (Gemini watches the public video)
  notes_per_lecture: 2        # only for shortlisted videos with no captions
  notes_when_blocked: 4       # ... more while YouTube is blocking caption requests, when notes are the only new evidence
  notes_min_score: 0.45       # ... whose title and chapters match a part at least this well, from a tier 1-2 channel
  # reading (D9)
  read_per_lecture: 4         # videos the AI reads per lecture, picked so that together they reach the most parts
  window_s: 30                # transcript window: what the AI's time markers point at
  smooth: 3                   # windows of moving average: a passage must stay on the part, not one mention
  sim_floor: 0.40             # a video is read for a part only if some passage is this similar (all-MiniLM-L6-v2)
  read_whole_words: 4500      # a transcript this short is read whole; a longer one is cut to the passages closest to the parts
  max_words_per_read: 4500    # (9000 words timed out on gemini-3.8-flash, 1 Nov), from anywhere in the video
  # checking (D10)
  verify_per_part: 2          # clips checked per part, best first
  max_words_per_clip: 5000    # the checker reads the whole clip, never a sample; a longer clip is not used
  min_s: 60                   # a clip is 1-25 minutes
  max_s: 1500
  pad_s: 5                    # a clip starts this many seconds before the first line that teaches the part
  snap_s: 25                  # a clip edge this close to a chapter edge moves to it
  min_video_s: 180            # no Shorts
  # the gate: all must hold (to calibrate on the team's hand-rated parts; starting values)
  gate:
    relevance: 4
    sufficiency: 4
    coverage: 0.66            # share of the part's checklist (sentences of `teaches` + key terms) taught, with a quote that is really in the clip
    clean_start: 2            # 1 = padded or cut mid-idea. A slightly loose edge is shown to the professor, not a reason to lose the clip
    clean_end: 2
    stands_alone: 3
    clarity: 4
    level_fit: 4
    min_share: 0.5            # clip minutes / part minutes, for one part; for a block, its minutes / the block's minutes
    max_share: 1.5
    min_share_in_block: 0.25  # no part of a block may be a token few seconds of it
  # the plan for the lecture (one video across consecutive parts beats a different video for each)
  block_gap_s: 180            # the next part's clip starts at most this long after the last one ended: one continuous watch
  continue_bonus: 0.15
  switch_penalty: 0.08
  reuse_overlap: 0.5          # the same minutes are not given to two separate parts (share of the shorter clip)

notes:
  model: gemini-3.6-flash     # only 3.6 / 3.8 flash are used; 3.8 timed out on YouTube input (504, 9 Nov)
  max_video_s: 2400           # about 240K input tokens at low resolution
  tries: 5                    # keys tried (a key may have used its daily quota)
  timeout_s: 170

coverage:
  window_s: 45              # transcript window length (seconds) for topic matching
  sim_covered: 0.42         # calibrated 2026-10-24 on an MIT OCW lecture: on-topic best window 0.55–0.62, off-topic <= 0.27
  segment_gap_s: 60         # merge covering windows closer than this into one segment
  min_segment_s: 60
  clip_min_s: 90            # clips are extended to at least this long so they are usable
  intro_skip_s: 45          # in videos longer than 5 min, a segment starting before this is treated as the intro
  page_chunk_words: 120     # web pages / readings are split into chunks of this many words

durations:                  # seconds
  clip_max: 1500            # an in-class clip / explainer: <= 25 min
  video_max: 5400           # anything longer than 90 min is only offered as a recorded lecture series part
  recorded_lecture_min: 1800

recency_years_fast_topics: 3   # topics flagged "novel/fast-moving": prefer material from the last N years

youtube:
  daily_unit_budget: 9000      # of the 10,000 free units/day; searches cost 100, details 1 per 50 videos
  results_per_search: 12
  max_searches_per_lecture: 3
  region: IN
  language: en

transcripts:
  max_per_lecture: 8           # transcripts fetched for the best pre-scored videos
  min_interval_s: 4.0          # pause between transcript requests (plus up to jitter_s at random): YouTube blocks
  jitter_s: 3.0                # an IP that asks for ~60 in 10 minutes (and, 1 Nov, after ~90 new ones in an hour at
                               # 1.5-2.5 s); after a block none are sent that run
  max_per_hour: 40             # at most this many new transcript requests in any hour (cached ones are free)

review:
  max_candidates_per_call: 10  # candidates the AI reviews per lecture (one call)

# Source tiers (authority). Tier 1 = universities and national programmes; 2 = established educators;
# 3 = practitioners and official documentation; 4 = general web (only when 1–3 cannot cover a topic).
tier_scores: {1: 1.0, 2: 0.8, 3: 0.65, 4: 0.35}
channels:                    # YouTube channel titles (case-insensitive substring match)
  tier1: [MIT OpenCourseWare, Stanford Online, Stanford, CMU, Carnegie Mellon, UC Berkeley, Berkeley, Harvard, CS50,
          NPTEL, IIT, IISc, Oxford, Cambridge, ETH, EPFL, NUS, Princeton, Cornell, University of Washington, Georgia Tech,
          Caltech, Yale, Columbia, Imperial College, University of Toronto, Waterloo, IIIT]
  tier2: [freeCodeCamp, 3Blue1Brown, StatQuest, Computerphile, Two Minute Papers, Fireship, Corey Schafer, sentdex,
          Andrej Karpathy, Yannic Kilcher, Abdul Bari, codebasics, Krish Naik, Google Cloud Tech, William Fiset, Neso Academy, Gate Smashers, Jenny's Lectures,
          Tech With Tim, ArjanCodes, mCoding, Numberphile, Ben Eater, Kevin Powell, Traversy Media, The Coding Train,
          Professor Messer, IBM Technology, Google for Developers, Microsoft Developer, AWS, NVIDIA Developer]
  tier3: [GOTO Conferences, InfoQ, Strange Loop, PyCon, PyData, NDC Conferences, JSConf, Devoxx, CppCon, USENIX,
          ACM, IEEE, Google Cloud Tech, GitHub, Anthropic, OpenAI, Hugging Face, DeepLearningAI, LangChain]
domains:                     # web readings
  tier1: [mit.edu, stanford.edu, cmu.edu, berkeley.edu, harvard.edu, princeton.edu, cornell.edu, washington.edu,
          ox.ac.uk, cam.ac.uk, ethz.ch, epfl.ch, nus.edu.sg, nptel.ac.in, iitm.ac.in, iitb.ac.in, iitd.ac.in, iiitd.ac.in,
          openstax.org, d2l.ai, ocw.mit.edu]
  tier2: [arxiv.org, acm.org, ieee.org, distill.pub, khanacademy.org, geeksforgeeks.org, realpython.com,
          freecodecamp.org, towardsdatascience.com, martinfowler.com, cs231n.github.io, lilianweng.github.io,
          colah.github.io, jalammar.github.io]
  tier3: [docs.python.org, developer.mozilla.org, learn.microsoft.com, cloud.google.com, aws.amazon.com,
          docs.github.com, kubernetes.io, pytorch.org, tensorflow.org, huggingface.co, engineering.fb.com,
          netflixtechblog.com, blog.google, research.google, openai.com, anthropic.com, github.com, kaggle.com,
          colab.research.google.com, modelcontextprotocol.io, docs.langchain.com, python.langchain.com, docs.anthropic.com,
          platform.openai.com, ai.google.dev, code.visualstudio.com]
# Also tier 3 without listing: documentation sites (docs.* / developer(s).* / *.readthedocs.io / a /docs/ path) and the
# topic's own official site (its domain name spells the topic, e.g. modelcontextprotocol.io for "Model context protocol").
blocklist:                   # never recommend (held-out test courses, paywalls when free_only)
  domains: [themodernsoftware.dev, coursera.org/learn, udemy.com, oreilly.com, medium.com/m/signin]
  title_fragments: [CS146S]
paywall_domains: [udemy.com, coursera.org, oreilly.com, pluralsight.com, educative.io, linkedin.com/learning]
social_domains: [linkedin.com, facebook.com, x.com/, twitter.com, instagram.com, threads.net, quora.com, reddit.com,
                 pinterest.com, tiktok.com]   # never offered as a reading or practice item
