# Degree (criterion) phrasings by evidence type. Models for G4/G6 — style, not content.
programming_assignment:
  - "such that at least {n}% of the provided test cases pass"
  - "with all public tests passing and no warnings from the configured static analyser"
  - "meeting the stated interface specification for every public method"
lab_task:
  - "completing all {n} steps of the lab sheet within the session"
  - "producing output that matches the reference for {n} supplied inputs"
exam_question:
  - "for a supplied {artefact} of at most {size}, within {minutes} minutes"
  - "identifying at least {n} distinct {items}, each supported by evidence from the {artefact}"
design_document:
  - "justifying each design decision against at least one stated requirement"
  - "covering every use case in the supplied requirements document"
project_deliverable:
  - "such that the delivered system satisfies every acceptance criterion agreed at the first milestone"
  - "demonstrated live, with {n} scenario walkthroughs chosen by the evaluator"
report:
  - "in at most {pages} pages, citing at least {n} primary sources"
code_review:
  - "identifying at least {n} of the {m} seeded defects, with a proposed fix for each"
presentation:
  - "in {minutes} minutes, answering evaluator questions on {n} design choices"
quiz:
  - "for {n} of {m} short items"
