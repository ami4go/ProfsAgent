# B.Tech. (common to all programmes): programme outcomes VERBATIM from the IIIT-D CSE course description template. Do not paraphrase.
programme: BTECH-COMMON
name: B.Tech. (common to all programmes)
source:
  doc: IIIT-Delhi CSE course description template (CSE course description template.xlsx, sheet 'Template', CO–PO mapping block)
  file: templates/iiitd_cse_course_template.xlsx
  retrieved: '2026-10-14'
  note: Outcome texts are VERBATIM from the template. Used for the CO–PO/PSO mapping that the template requires for CSExxx courses.
po:
- id: BTECH-COMMON/PO1
  kind: PO
  label: PO1
  text: 'Engineering knowledge: Apply the knowledge of mathematics, science, engineering fundamentals and an engineering specialization to the
    solution of complex engineering problems.'
- id: BTECH-COMMON/PO2
  kind: PO
  label: PO2
  text: 'Problem analysis: Identify, formulate, review research literature, and analyze complex engineering problems reaching substantiated conclusions
    using first principles of mathematics, natural sciences, and engineering sciences.'
- id: BTECH-COMMON/PO3
  kind: PO
  label: PO3
  text: 'Design/development of solutions: Design solutions for complex engineering problems and design system components or processes that meet
    the specified needs with appropriate consideration for the public health and safety, and the cultural, societal, and environmental considerations.'
- id: BTECH-COMMON/PO4
  kind: PO
  label: PO4
  text: 'Conduct investigations of complex problems: Use research-based knowledge and research methods including design of experiments, analysis
    and interpretation of data, and synthesis of the information to provide valid conclusions.'
- id: BTECH-COMMON/PO5
  kind: PO
  label: PO5
  text: 'Modern tool usage: Create, select, and apply appropriate techniques, resources, and modern engineering and IT tools including prediction
    and modeling to complex engineering activities with an understanding of the limitations.'
- id: BTECH-COMMON/PO6
  kind: PO
  label: PO6
  text: 'The engineer and society: Apply reasoning informed by the contextual knowledge to assess societal, health, safety, legal and cultural
    issues and the consequent responsibilities relevant to the professional engineering practice.'
- id: BTECH-COMMON/PO7
  kind: PO
  label: PO7
  text: 'Environment and sustainability: Understand the impact of the professional engineering solutions in societal and environmental contexts,
    and demonstrate the knowledge of, and need for sustainable development.'
- id: BTECH-COMMON/PO8
  kind: PO
  label: PO8
  text: 'Ethics: Apply ethical principles and commit to professional ethics and responsibilities and norms of the engineering practice.'
- id: BTECH-COMMON/PO9
  kind: PO
  label: PO9
  text: 'Individual and team work: Function effectively as an individual, and as a member or leader in diverse teams, and in multidisciplinary
    settings.'
- id: BTECH-COMMON/PO10
  kind: PO
  label: PO10
  text: 'Communication: Communicate effectively on complex engineering activities with the engineering community and with society at large, such
    as, being able to comprehend and write effective reports and design documentation, make effective presentations, and give and receive clear
    instructions.'
- id: BTECH-COMMON/PO11
  kind: PO
  label: PO11
  text: 'Project management and finance: Demonstrate knowledge and understanding of the engineering and management principles and apply these
    to one’s own work, as a member and leader in a team, to manage projects and in multidisciplinary environments.'
- id: BTECH-COMMON/PO12
  kind: PO
  label: PO12
  text: 'Life-long learning: Recognize the need for, and have the preparation and ability to engage in independent and life-long learning in the
    broadest context of technological change.'
