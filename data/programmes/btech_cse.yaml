# B.Tech (CSE) — programme-level outcomes, VERBATIM from the source below.
# Do not paraphrase. short_label is ours (for tables) and is marked as such.
programme: BTECH-CSE
name: B.Tech. in Computer Science and Engineering
source:
  doc: "Regulations for the B.Tech. in Computer Science and Engineering (CSE) Program — 2019 August"
  url: "https://iiitd.ac.in/sites/default/files/docs/education/2019/2019%20-August-BTech(CSE)-Regulations.pdf"
  page: 1
  retrieved: 2026-09-30
  note: >-
    The document calls these "Overall objectives of the B.Tech. (CSE) program" (added Nov 2014 per its
    revision log). We treat them as POs. TODO: check whether a newer CSE programme regulation supersedes it.

peo:
  - id: BTECH-CSE/PEO1
    text: >-
      prepare students to undertake careers involving innovation and problem solving using computational
      techniques and technologies, or to undertake advanced studies for research careers, or to take up
      Entrepreneurship.
    source_note: "Preamble, 'The objective of the B.Tech. program in CSE is to …'"

po:
  - {id: BTECH-CSE/PO1,  short_label: "Theoretical foundations",       text: "Understanding of theoretical foundations and limits of computing"}
  - {id: BTECH-CSE/PO2,  short_label: "Levels of abstraction",         text: "Understanding of computing at different levels of abstraction including circuits and computer architecture, operating systems, algorithms, and applications."}
  - {id: BTECH-CSE/PO3,  short_label: "Adapt techniques to new problems", text: "Ability to adapt established models, techniques, algorithms, data structures, etc., for efficiently solving new problems"}
  - {id: BTECH-CSE/PO4,  short_label: "Design/implement/evaluate systems", text: "Ability to design, implement, and evaluate computer based system or application to meet the desired needs using modern tools and methodologies"}
  - {id: BTECH-CSE/PO5,  short_label: "Teamwork",                      text: "Ability to function effectively in teams to accomplish a common goal"}
  - {id: BTECH-CSE/PO6,  short_label: "Professional ethics",           text: "An understanding of professional and ethical responsibility."}
  - {id: BTECH-CSE/PO7,  short_label: "Communication",                 text: "Ability to communicate effectively with a wide range of audience"}
  - {id: BTECH-CSE/PO8,  short_label: "Life-long learning",            text: "Ability to self-learn and engage in life-long learning"}
  - {id: BTECH-CSE/PO9,  short_label: "Advanced techniques and tools", text: "Understanding and ability to use advanced techniques and tools in different areas of computing"}
  - {id: BTECH-CSE/PO10, short_label: "Research tasks",                text: "Ability to undertake small research tasks and projects"}
  - {id: BTECH-CSE/PO11, short_label: "Entrepreneurship",              text: "Ability to take an idea and develop into a business plan for an entrepreneurial venture (if desired)"}
  - {id: BTECH-CSE/PO12, short_label: "Societal impact",               text: "An understanding of the impact of solutions in an economic, societal, and environment context."}

# PO -> PEO SERVES edges: to be curated and signed off by an advisor (not inferred by an LLM).
serves: []
