form:
  1. COURSE NAME: Software Development using AI
  10. WEEKLY STUDENT EFFORT: '[NOT SPECIFIED]'
  11. LAB / PRACTICAL COMPONENT: "Lab required: Yes \xE2\u20AC\u201D hands-on coding\
    \ and development activities\n\nAvailable infrastructure: Student development\
    \ machines, access to\nAI coding tools/APIs, software development environments,\
    \ and TA support.\n"
  12. ASSESSMENT PREFERENCES: 'Preferred components: Practical assignments, hands-on
    coding exercises,

    project-based evaluation, and a final project.


    Components to avoid: none


    Rationale: Assessment should emphasize the ability to apply modern

    AI-assisted development practices rather than primarily testing theory.

    '
  13. SPECIAL CONSTRAINTS: '[NONE]

    CRITICAL: Set the semester length to exactly 50 weeks.'
  14. CURRICULUM CONTEXT: '    Advanced software-development course positioned around
    emerging AI-native development practices. It builds on programming and software
    engineering foundations while introducing agent-assisted development, modern tooling,
    specification-driven workflows, automated evaluation, and software-factory concepts.'
  2. SHORT COURSE DESCRIPTION: This course examines modern AI-native software development,
    where developers collaborate with increasingly capable coding agents. It covers
    how to define intent, provide effective context, structure development workflows,
    and coordinate AI tools. Students gain practical experience designing and evaluating
    agent-assisted software development processes.
  3. TOPICS / CONTENT AREAS: "Treatment of this list: starting hypotheses \xE2\u20AC\
    \u201D may add/drop/reorder with justification\nA. AI-Native Development: AI-assisted\
    \ coding, coding agents, developer workflows\n\nB. Agentic Software Engineering:\
    \ MCP, agent skills, tool use, context engineering\n\nC. Specification & Planning:\
    \ spec-driven development, requirements to executable specifications\n\nD. Software\
    \ Development Workflows: loop engineering, iterative development, software factories\n\
    \nE. Engineering Practice: automated testing, evaluation, deployment, reliability\n\
    \nF. Practical Development: hands-on coding, projects, emerging developer tools\n"
  4. COURSE INTENT: "Central question the course answers: How can software developers\
    \ effectively\ndesign and operate development workflows in which humans and AI\
    \ agents\ncollaboratively build reliable software?\n\nPedagogical emphasis: Practical,\
    \ workflow-oriented understanding through\nhands-on development and experimentation.\n\
    \nThis course should NOT become:\n- A general introduction to AI or machine learning\n\
    - A traditional programming course\n- A purely theoretical treatment of large\
    \ language models    \n"
  5. TARGET STUDENTS: 'Programmes: B.Tech. CSE

    Year: 3rd/4th year

    Assumed background: Strong programming and software development fundamentals;

    familiarity with advanced programming and basic software engineering concepts.

    '
  6. EXPECTED LEVEL / COURSE CODE: Advanced undergraduate / [NOT SPECIFIED]
  7. CREDITS: '[NOT SPECIFIED]'
  8. L-T-P / CONTACT HOURS: '[NOT SPECIFIED]'
  9. SEMESTER LENGTH: '[NOT SPECIFIED]'
