form:
  1. COURSE NAME: Compiler Optimisation
  2. SHORT COURSE DESCRIPTION: An advanced course on how optimising compilers make programs faster. Students study intermediate
    representations, data-flow analysis, SSA form, classic scalar and loop optimisations, register allocation and instruction
    scheduling, and implement and measure optimisation passes in a production compiler framework.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Intermediate representations: control-flow graphs, three-address code, LLVM IR

    B. Data-flow analysis: lattices, reaching definitions, liveness, available expressions

    C. SSA form: construction, dominance, SSA-based optimisations

    D. Scalar and loop optimisations: constant propagation, dead-code elimination, LICM, unrolling, vectorisation

    E. Back end: register allocation, instruction selection and scheduling

    F. Practice: writing and benchmarking LLVM passes


    Material the professor already has:

    - Engineering a Compiler, Keith Cooper and Linda Torczon

    - Advanced Compiler Design and Implementation, Steven Muchnick

    - LLVM documentation'
