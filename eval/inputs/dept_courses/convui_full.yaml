form:
  1. COURSE NAME: Designing Conversational and Voice Interfaces
  2. SHORT COURSE DESCRIPTION: A studio course on designing chatbots and voice assistants that people find useful and trustworthy.
    Students research user needs, write conversation flows and personas, prototype chat and voice experiences, design for
    errors and accessibility, and test and iterate their designs with users.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Foundations: how people converse, turn-taking, grounding, conversational UX principles

    B. Research: user needs, intents, context of use

    C. Conversation design: flows, prompts, persona, tone, error recovery

    D. Voice: speech recognition limits, prosody, multimodal and accessible design

    E. Designing with large language models: guardrails, transparency, trust

    F. Prototyping and evaluation: Wizard-of-Oz, usability testing, metrics


    Material the professor already has:

    - Designing Voice User Interfaces, Cathy Pearl

    - Conversational Design, Erika Hall'
