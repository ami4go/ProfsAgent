form:
  1. COURSE NAME: Deep Learning for Protein Structure and Design
  2. SHORT COURSE DESCRIPTION: A course on the deep-learning methods that predict and design protein structures. Students
    review protein structure and data sources, learn the models behind AlphaFold and protein language models, evaluate predicted
    structures, and use generative models for protein design in hands-on notebooks.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Protein basics: sequence, structure levels, PDB and UniProt

    B. Representations: sequences, multiple sequence alignments, graphs and 3D coordinates

    C. Structure prediction: AlphaFold2 ideas, evoformer, structure module, confidence scores

    D. Protein language models: ESM, embeddings, variant-effect prediction

    E. Protein design: inverse folding, diffusion-based generative design

    F. Evaluation and ethics: RMSD, TM-score, pLDDT; biosafety


    Material the professor already has:

    - Highly accurate protein structure prediction with AlphaFold, Jumper et al., Nature 2021

    - Introduction to Protein Structure, Carl Branden and John Tooze'
