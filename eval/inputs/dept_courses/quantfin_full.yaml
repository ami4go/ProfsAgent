form:
  1. COURSE NAME: Introduction to Quantitative Finance
  2. SHORT COURSE DESCRIPTION: An introduction to the quantitative methods used in finance for students with basic probability
    and programming. Students learn time value of money, returns and risk, portfolio theory, asset pricing models, and the
    pricing of options with binomial trees and Black-Scholes, and they apply these to real market data in Python.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Foundations: time value of money, bonds, yields, returns

    B. Risk and return: statistics of returns, diversification, Markowitz portfolios

    C. Asset pricing: CAPM, factor models

    D. Derivatives: forwards, futures, options, binomial trees, Black-Scholes

    E. Risk management: Value at Risk, stress testing

    F. Practice: market data analysis and backtesting in Python


    Material the professor already has:

    - Options, Futures, and Other Derivatives, John C. Hull

    - Investments, Bodie, Kane and Marcus'
