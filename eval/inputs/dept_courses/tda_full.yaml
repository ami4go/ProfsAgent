form:
  1. COURSE NAME: Topological Data Analysis
  2. SHORT COURSE DESCRIPTION: An introduction to topological methods for understanding the shape of data. Students learn
    simplicial complexes, homology, filtrations and persistent homology, the stability of persistence diagrams, and the Mapper
    algorithm, and they apply these with Python libraries to point clouds, images and networks.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Background: metric spaces, simplicial complexes, Vietoris-Rips and Čech complexes

    B. Homology: chain complexes, Betti numbers, computing homology over a field

    C. Persistent homology: filtrations, barcodes, persistence diagrams

    D. Stability and distances: bottleneck and Wasserstein distances, stability theorem

    E. Mapper and visualisation of high-dimensional data

    F. Applications: point clouds, images, networks; persistence features for machine learning


    Material the professor already has:

    - Computational Topology: An Introduction, Herbert Edelsbrunner and John Harer'
