form:
  1. COURSE NAME: 'TinyML: Machine Learning on Microcontrollers'
  2. SHORT COURSE DESCRIPTION: A lab-based course on running machine learning on low-power microcontrollers. Students collect
    sensor data, train small models, compress them with quantisation and pruning, deploy them on embedded boards, and measure
    latency, memory and energy for applications such as keyword spotting and gesture recognition.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. Embedded systems for ML: microcontrollers, memory, power, sensors

    B. Data: collecting and preprocessing sensor, audio and image data

    C. Small models: CNNs and other compact architectures for edge tasks

    D. Model compression: quantisation, pruning, knowledge distillation

    E. Deployment: TensorFlow Lite for Microcontrollers, on-device inference

    F. Measurement and applications: latency, memory, energy; keyword spotting, gestures, anomaly detection


    Material the professor already has:

    - TinyML, Pete Warden and Daniel Situnayake (O''Reilly)'
