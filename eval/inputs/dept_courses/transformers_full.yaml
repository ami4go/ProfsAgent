form:
  1. COURSE NAME: Introduction to Transformer Architecture
  2. SHORT COURSE DESCRIPTION: A course on the transformer, the architecture behind modern language and vision models. Students
    build attention and a transformer from scratch, study tokenisation, positional encoding, training and scaling, and examine
    encoder, decoder and encoder-decoder variants, fine-tuning and efficient inference.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. From sequence models to attention: RNN limits, attention as soft lookup

    B. The transformer block: self-attention, multi-head attention, positional encoding, layer norm, residuals

    C. Tokenisation and embeddings: BPE, embeddings, the language-modelling objective

    D. Variants: encoder-only, decoder-only, encoder-decoder; vision transformers

    E. Training and scaling: optimisation, scaling laws, pre-training and fine-tuning

    F. Efficient inference: KV cache, quantisation, efficient attention


    Material the professor already has:

    - Attention Is All You Need, Vaswani et al., 2017

    - Speech and Language Processing, Jurafsky and Martin (3rd edition draft)'
