form:
  1. COURSE NAME: Web Development for All
  2. SHORT COURSE DESCRIPTION: An introductory, hands-on course in building and deploying websites and small web applications,
    open to students of every programme. Students learn how the web works, write structured and accessible pages, style them
    responsively, add interactivity with JavaScript, call web APIs, and deploy a working site. By the end they can build,
    test and publish a small full-stack web application on their own.
  3. TOPICS / CONTENT AREAS: 'Treatment of this list: starting hypotheses — may add/drop/reorder with justification

    A. How the web works: HTTP, browsers, URLs, DNS, client and server

    B. HTML and accessibility: semantic structure, forms, WCAG basics

    C. CSS: layout with flexbox and grid, responsive design

    D. JavaScript: DOM, events, fetch and asynchronous code, calling REST APIs

    E. Back end basics: a small server, routes, a simple database, authentication basics

    F. Tooling and deployment: Git, developer tools, testing, static and cloud hosting


    Material the professor already has:

    - MDN Web Docs (Mozilla Developer Network)

    - Eloquent JavaScript, Marijn Haverbeke'
