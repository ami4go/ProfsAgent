# ProfsAgent · per-lecture choices for the professor. Read the summary, then answer yes / no to each choice;
# several can be yes. The want_* questions apply only when assistance is yes. Leave ~ for unanswered.
_questions:
  own_material: Will you teach this lecture with your own material? [yes/no]
  attach_material: Do you want to attach your own material (slides, notes, papers, links) and have ProfsAgent work with it?
    [yes/no]
  generate_material: Do you want ProfsAgent to generate the lecture material (slides and notes)? [yes/no]
  assistance: Do you want learning resources found for you (videos, blogs and readings, practice, recorded lectures)? [yes/no]
  guest_lecture: Do you want suggestions for a guest speaker (expert or practitioner) to invite for this lecture? [yes/no]
  attachments: Files or links you attach (when attach_material is yes)
  attach_tasks: 'What to do with them: any of [''slides'', ''summary'', ''quiz'', ''gap_check'', ''enrich'']'
  want_videos: (if assistance) Lecture video recommendations (short explainers, talks)? [yes/no]
  want_readings: (if assistance) Blogs, articles, book chapters or documentation to read? [yes/no]
  want_practice: (if assistance) Interactive material or practice (notebooks, exercises, datasets)? [yes/no]
  want_recorded_lecture: (if assistance) A full recorded lecture from another university (flipped class)? [yes/no]
  want_clips: (if assistance) Clip playlists (only the minutes of a long video that cover this topic)? [yes/no]
  confidence: How confident are you teaching this topic? (1 = not at all, 5 = fully)
  note: Anything we should know? (e.g. 'students struggle with X')
