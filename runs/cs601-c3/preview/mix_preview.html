<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e3de;--accent:#1f3a8a;
--slides:#5b7bd5;--youtube:#d64545;--youtube_bridge:#e08a3c;--notebooklm:#2f9e7a;--in_class:#8a5cc7;--simulation:#c7a12f;--recap:#9a9a94;--quiz:#4a4a46}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1e;--ink:#ecebe6;--mute:#a3a29c;--line:#34342f;--accent:#9db4ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:100vh;position:sticky;top:0}
nav h1{font-size:15px;margin:0 0 4px}nav p{color:var(--mute);font-size:12px;margin:0 0 12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--line)}nav button.on{background:var(--accent);color:#fff}
nav small{color:inherit;opacity:.7}
main{padding:24px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);margin-bottom:12px}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar div{color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;border-right:2px solid var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kv{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}.kv b{display:block;font-size:18px}.kv span{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:12px;white-space:nowrap}
.pre{display:inline-block;margin-top:4px;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.ev{font-size:12px;color:var(--mute);margin-top:4px}.ev a{color:var(--accent)}
.notes li{margin:2px 0}.q{margin:10px 0}.q ol{margin:4px 0 0 0;padding-left:20px}.ans{color:var(--notebooklm);font-weight:600}
details summary{cursor:pointer;color:var(--accent)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}
td:nth-child(4),th:nth-child(4){display:none}}

pt free; 15 min were taken from the longest parts"}, {"code": "L-AI", "message": "the AI changed 1 part(s) within the rules (see each reason)"}], "note": "", "proposed_by": "rules + D7", "proposed_at": "2026-11-03 15:39:26", "approved_at": "2026-11-03 15:39:26", "approved_by": "CLI", "materials": {"notebooklm": "notebooklm/W02.L1.md", "quiz": "quiz/W02.L1.json", "quiz_questions": 7}, "quiz": {"lecture_id": "W02.L1", "topic": "Model context protocols and architecture", "made_at": "2026-11-03 15:46:53", "minutes": {"recap": 5, "quiz": 10}, "recap": [{"component": "W01.L2.C1", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "How does adopting a Client-Host-Server topology with Model Context Protocol (MCP) solve the M×N integration problem for LLM applications?", "options": ["It removes the need for tool invocation by having the LLM directly execute local code.", "It converts all tool communication payloads from JSON into binary protocols.", "It replaces custom integrations with a standardized interface between host environments and external servers.", "It mandates a single centralized database that all LLM clients and data sources must share."], "answer": "C", "explanation": "MCP introduces a standardized client-host-server interface, decoupling LLM clients from disparate external tools and reducing M×N bespoke integrations into an M+N architecture."}, {"component": "W01.L2.C2", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "In local MCP communication using the stdio transport layer, how are requests and responses framed and transmitted?", "options": ["As raw binary streams sent across shared system memory", "As protocol buffers transmitted via a WebSockets connection", "As JSON-RPC 2.0 structured messages sent over standard input and output streams", "As HTTP POST requests with Server-Sent Events headers"], "answer": "C", "explanation": "The stdio transport mechanism uses standard input/output streams to frame and exchange JSON-RPC 2.0 structured requests, responses, and notifications between host and subprocess."}, {"component": "W01.L2.C3", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "During the MCP initialization handshake, what is the primary role of capability negotiation?", "options": ["To determine whether messages should switch from standard text to compressed binary format", "To verify API keys and encrypt the stdio communication channel", "To dynamically allocate hardware CPU and memory limits for the server process", "To allow client and server to declare supported features like tools, resources, and prompts before starting operations"], "answer": "D", "explanation": "Capability negotiation occurs during initialization so both client and server can declare supported features (such as resources, prompts, and tools) and ensure compatibility before requests begin."}], "questions": [{"component": "W02.L1.C1", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "How do resources differ from tools in Model Context Protocols (MCP)?", "options": ["Resources provide passive context data for reading, whereas tools enable dynamic side-effects and execution.", "Resources allow models to execute shell commands, whereas tools only provide static files.", "Resources require dynamic parameters, whereas tools do not accept input arguments.", "Resources are defined on the host client, whereas tools reside exclusively on external cloud services."], "answer": "A", "explanation": "Resources act as passive data providers (like context or read-only files), while tools allow models to run dynamic operations and side-effects."}, {"component": "W02.L1.C2", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "A developer wants to expose dynamic log streams where the log file URI changes based on a requested user ID parameter. Which MCP construct should they use?", "options": ["An environment variable override in the host workspace setting", "A fixed text resource without dynamic URI mapping", "A static tool definition with hardcoded execution parameters", "A parameterized Resource Template with a dynamic URI scheme"], "answer": "D", "explanation": "Resource templates expose parameterized URI schemes, allowing clients to construct dynamic URIs to read specific dynamic context."}, {"component": "W02.L1.C3", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "How does an MCP host validate arguments provided by an LLM before invoking a tool via `tools/call`?", "options": ["It validates arguments against the `inputSchema` declared in the server's `tools/list` response.", "It relies on the server to bypass validation if the connection uses stdio.", "It converts all input values to strings automatically without schema checks.", "It forwards the raw prompt to a manual host validation queue."], "answer": "A", "explanation": "Tools define their input requirements via standard JSON Schema (`inputSchema`) during discovery (`tools/list`), which allows strict client/server argument validation."}, {"component": "W02.L1.C4", "lo_ids": ["CO1.LO1"], "bloom": 1, "question": "Which mandatory fields are required in an `mcpServers` workspace configuration entry to launch a local subprocess context server?", "options": ["`uriTemplate` and `mimeType` to specify context encoding formats", "`promptInjection` and `sandboxMode` to set protocol execution boundaries", "`toolsList` and `callResult` to map server callback functions", "`command` and `args` to specify the executable binary and its launch arguments"], "answer": "D", "explanation": "Subprocess server declarations in `mcpServers` require at minimum the executable `command` and optional command-line `args` (along with `env`) to start the server."}, {"component": "W02.L1.C5", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "An external tool returns raw text output that contains malicious instructions designed to hijack the LLM context. What is the most effective mitigation strategy?", "options": ["Disabling all logging from stderr to suppress error messages", "Running the server in high-privilege administrator mode to override unexpected errors", "Hardcoding database secrets directly inside the shared client configuration file", "Enforcing user-in-the-loop explicit approvals before executing sensitive downstream tools"], "answer": "D", "explanation": "Requiring explicit human approval (user-in-the-loop) for sensitive side-effects stops prompt injections contained in untrusted tool responses from executing unchecked actions."}, {"component": "W02.L1.C6", "lo_ids": ["CO1.LO1"], "bloom": 3, "question": "A student configures an MCP server in `mcpServers` with `\"command\": \"python\"`, but the server immediately terminates because it lacks the script path and API key. Which part of the configuration template needs fixing?", "options": ["Changing the server protocol registration from JSON-RPC to XML", "Removing the `command` attribute and replacing it with a static `uri` scheme", "Updating the tool's JSON Schema type definitions from string to boolean", "Adding the script path under `args` and the required API key key-values under `env`"], "answer": "D", "explanation": "Command-line arguments (like script files) must be passed via the `args` array and environment parameters (like API keys) must be set in the `env` dictionary of the configuration schema."}, {"component": "W02.L1.C7", "lo_ids": ["CO1.LO1"], "bloom": 2, "question": "A local MCP server process fails during initialization without sending a JSON-RPC error response. Where should a developer look to diagnose the startup error?", "options": ["The server's public `resources/list` payload", "The client host's static UI rendering logs", "The subprocess `stderr` log stream of the context server", "The `inputSchema` section of the prompt catalog"], "answer": "C", "explanation": "Runtime crashes, missing dependencies, or syntax errors in local server binaries output details directly to the subprocess standard error (`stderr`) stream."}], "problems": []}, "week": 2}, {"lecture_id": "W02.L2", "topic": "C anation": "Pruning irrelevant directories and files reduces context pollution and keeps token usage within limits, preventing the LLM from getting distracted by unrelated codebase noise."}, {"component": "W02.L2.C3", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "A custom MCP tool for linting files frequently fails because the agent passes invalid parameter data types. How should the tool definition be updated to resolve this according to MCP specifications?", "options": ["Switch the workspace isolation model from container sandboxing to a local git worktree.", "Define explicit JSON schema types and parameter validation rules in the tool's input descriptor.", "Enable sliding context windows to prune past tool validation errors.", "Inject the full static analysis output directly into the global prompt context."], "answer": "B", "explanation": "MCP tool discovery relies on structured JSON schemas; explicitly defining required parameters and data types ensures the harness validates inputs before invoking the tool."}, {"component": "W02.L2.C4", "lo_ids": ["CO1.LO2"], "bloom": 4, "question": "A system loading 100+ verbose MCP tool definitions into every prompt suffers from high latency and hallucinated tool invocations. How does lazy tool registration mitigate this context pollution issue compared to global tool injection?", "options": ["By bypassing environment sandboxing to execute static analysis directly on the host.", "By replacing JSON-RPC schemas with lightweight hardcoded shell scripts.", "By dynamic-loading schema descriptors only when relevant sub-tasks are identified, lowering token overhead and tool confusion.", "By running all tool executions in parallel without waiting for agent observation loops."], "answer": "C", "explanation": "Lazy tool registration avoids context pollution by presenting only relevant context or high-level summaries initially, providing full tool schemas on demand to keep token overhead low and improve tool selection accuracy."}], "pro r agent execution logs.", "It directly executes the external tool's logic inside the client process.", "It generates natural language responses and sends them directly to the end user."], "answer": "A", "explanation": "The MCP Client resides within the host application (like an IDE or agent workspace) and manages communication and transport protocol handlers between the host and external MCP Servers."}, {"component": "W03.L2.C2", "lo_ids": ["CO1.LO2"], "bloom": 2, "question": "Which JSON-RPC 2.0 method is sent by an MCP client over standard input/output streams to request the list of exposed tools from an MCP server?", "options": ["tools/call", "mcp/discover", "tools/list", "system/getTools"], "answer": "C", "explanation": "In the MCP JSON-RPC 2.0 specification, `tools/list` is the standard method sent by the client to perform tool discovery on the server."}, {"component": "W03.L2.C3", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "An LLM agent frequently passes invalid floating-point numbers to a tool parameter `port_number` that expects a valid positive port integer. How should you update the tool's `inputSchema` to enforce valid input?", "options": ["Set `type` to `\"string\"` so the LLM converts the port number to a string before calling.", "Add a prompt hint inside the parameter's text description asking the agent to avoid decimals.", "Mark the `port_number` property as optional so the server fills in a default integer when validation fails.", "Set the `type` of `port_number` to `\"integer\"`, add `\"minimum\": 1`, and include `port_number` in the `required` array."], "answer": "D", "explanation": "JSON Schema permits structural and type constraints such as setting `\"type\": \"integer\"` and numerical limits (`\"minimum\": 1`) inside `inputSchema` to prevent bad LLM tool invocations."}, {"component": "W03.L2.C4", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "When implementing an MCP server using an official SDK, how are local functions typically registered as callable tools exposed to the client?", "options": ["By declaring the function names in an external environment variable.", "By applying SDK decorator syntax (e.g., `@mcp.tool()`) or registration functions over tool handlers.", "By manually parsing stdin buffers with regex inside a custom event loop.", "By writing standard REST API controllers and mapping them to HTTP POST routes."], "answer": "B", "explanation": "Official MCP SDKs simplify development by providing decorators or server handlers that automatically parse incoming JSON payloads into function arguments."}, {"component": "W03.L2.C5", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "A custom MCP tool function executes a local file read operation. What structured object format should the function return to pass the text output back to the client over stdio?", "options": ["A simple boolean value indicating whether the read succeeded.", "A raw unformatted string printed directly to process stdout.", "A standard HTTP 200 OK response wrapper.", "A `CallToolResult` structure containing formatted content blocks such as `TextContent`."], "answer": "D", "explanation": "MCP tool handlers return standard structures like `CallToolResult` populated with structured content items like `TextContent` to report output."}, {"component": "W03.L2.C6", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "You have compiled a custom MCP server executable. How should the agent workspace configuration file be updated so that the host application automatically launches and connects to the server?", "options": ["Move the executable to the root system folder `/bin` and restart the machine.", "Add a system environment variable named `DISCOVER_MCP_SERVERS=true`.", "Embed the binary byte sequence directly inside the workspace prompt file.", "Define an entry inside the `mcpServers` object with the server executable command and any required command-line arguments."], "answer": "D", "explanation": "Workspace settings configure custom MCP servers by declaring them under the `mcpServers` dictionary key with the executable `command`, `args`, and `env` parameters."}, {"component": "W03.L2.C7", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "During execution, a tool encounters a runtime error because a user-requested file is missing. How should the MCP server communicate this failure back to the LLM agent?", "options": ["Throw an unhandled exception to crash the stdio process so the client detects the crash.", "Send a JSON-RPC transport error code `-32600` (Invalid Request) back over the stream.", "Return an empty success response so the LLM assumes the file contained no text.", "Return a `CallToolResult` with `isError` set to `true` and the error message inside the text content block."], "answer": "D", "explanation": "Tool execution runtime failures should be returned gracefully in the result payload with `isError: true` so the agent can read the error text and attempt recovery."}], "problems": []}, "week": 3}, {"lecture_id": "W04.L1", "topic": "Custom tool integrations using model context protocols", "minutes": 30, "status": "approved", "preset": "slides_only", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W04.L1.C1", "title": "Static analysis and linter rules for safe MCP server code", "minutes": 15, "kind": "mechanism", "bloom": 3, "way": "slides", "when": "in_class", "rule": "R5", "reason": "Slides suit static analysis explanation; no video, NotebookLM covers only 20% of key terms.", "alternative": null, "allowed": ["slides", "in_class"], "locked": false, "set_by": "ai", "prep_minutes": 15, "segments": [], "video_minutes": 0.0, "bridge": [], "coverage": 0.2, "uncovered": ["Static Analysis", "Type Checking", "Async Warnings", "Strict Type Annotations"], "simulation": null}, {"component": "W04.L1.C2", "title": "Activity: Passing automated MCP tool test suites without warnings", "minutes": 15, "kind": "activity", "bloom": 3, "way": "in_class", "when": "in_class", "rule": "R1", "reason" g network connections.", "Untyped bindings allow unexpected payload structures from the LLM to cause unhandled runtime errors.", "The linter requires all JSON schema payloads to be encrypted prior to parsing.", "Static analyzers cannot parse async functions unless parameters are strings."], "answer": "B", "explanation": "Untyped JSON bindings allow malformed or unexpected responses from the LLM to bypass type checks, potentially causing runtime crashes in the tool handler."}, {"component": "W04.L1.C2", "lo_ids": ["CO1.LO2"], "bloom": 3, "question": "In an agent workspace pipeline, all functional integration tests for an MCP tool pass, yet the build fails static validation. What is the most likely cause based on production standards?", "options": ["The test harness requires manual user confirmation for each tool execution.", "The server implementation contains unresolved static analysis warnings.", "The agent workspace environment only supports synchronous tool integration.", "Integration tests cannot run alongside linter checks."], "answer": "B", "explanation": "Production-grade tool configuration requires both all functional tests to pass and zero static analysis warnings from configured linters."}], "questions": [{"component": "W04.L2.C1", "lo_ids": ["CO2.LO3"], "bloom": 2, "question": "Why does relying on unstructured product descriptions frequently lead to scope creep in software development?", "options": ["Unstructured descriptions lack defined system boundaries, allowing implicit assumptions to expand project scope.", "Unstructured descriptions restrict system actors to a single administrative role.", "Unstructured descriptions strictly enforce ISO standards, which slows down core feature development.", "Developers cannot convert text to code without automated translation tools."], "answer": "A", "explanation": "Without standardized specifications and clear system boundaries, informal descriptions leave room for ambiguity and unvetted features, causing scope creep."}, {"component": "W04.L2.C2", "lo_ids": ["CO2.LO3"], "bloom": 2, "question": "In a food delivery app, a customer places an order, and the app uses a third-party payment gateway to authorize credit cards. How is the payment gateway classified?", "options": ["System Boundary", "Secondary Supporting Actor", "Primary Actor", "Internal Automated Process"], "answer": "B", "explanation": "External services or systems that interact with the system to help fulfill a primary actor's goal are classified as secondary supporting actors."}, {"component": "W04.L2.C3", "lo_ids": ["CO2.LO3"], "bloom": 2, "question": "How does Cockburn's casual/brief use case format differ from a fully dressed use case format?", "options": ["Brief formats specify database schema tables, while fully dressed formats describe UI mockups.", "Brief formats summarize the main scenario in a brief paragraph, whereas fully dressed formats detail preconditions, guarantees, and extension flows.", "Brief formats document third-party systems, while fully dressed formats document internal users.", "Brief formats are written in passive voice, whereas fully dressed formats require active voice."], "answer": "B", "explanation": "Brief use cases offer a quick paragraph summary of successful goal completion, while fully dressed use cases comprehensively detail preconditions, failure branches, and guarantees."}, {"component": "W04.L2.C4", "lo_ids": ["CO2.LO3"], "bloom": 3, "question": "A raw narrative states: 'When the buyer clicks the green button on the React dashboard, the server saves the product to the wishlist table.' Applying extraction heuristics, which clean actor-goal pair should be created?", "options": ["Buyer -> Add product to wishlist", "Server -> Render wishlist screen", "Buyer -> Click green button", "React Dashboard -> Save product to table"], "answer": "A", "explanation": "Extraction heuristics filter out UI elements (green button, React dashboard) and technical implementation details (wishlist table) to capture the core domain goal: 'Add product to wishlist'."}, {"component": "W04.L2.C5", "lo_ids": ["CO2.LO3"], "bloom": 3, "question": "Which of the following steps follows standard guidelines for writing steps in a Main Success Scenario?", "options": ["The Customer enters shipping address and submits the order.", "System should show a pop-up confirmation screen to user.", "The credit card details are validated by the system.", "Password verification occurs on the server background worker."], "answer": "A", "explanation": "Standard guidelines require steps to be written in active voice with an explicit Subject-Verb-Object structure (e.g., 'The Customer enters...')."}, {"component": "W04.L2.C6", "lo_ids": ["CO2.LO3"], "bloom": 3, "question": "A product prompt reads: 'The user creates an account, searches for items, adds them to cart, and pays using UPI.' When structuring this prompt into formal use case outlines, what is the best approach?", "options": ["Split the compound goals into separate use cases like 'Search Items' and 'Checkout Order'.", "Define the entire prompt as a system boundary instead of a set of use cases.", "Exclude the payment phase because third-party integrations cannot be documented.", "Merge all tasks into a single 20-step use case called 'User Operations'."], "answer": "A", "explanation": "Messy feature narratives containing multiple independent goals should be split into distinct, focused use cases to clarify boundaries and maintain spec readability."}, {"component": "W04.L2.C7", "lo_ids": ["CO2.LO3"], "bloom": 2, "question": "What is the primary purpose of specifying a 'Precondition' in a standard use case document?", "options": ["To detail the user interface layout required for the initial screen.", "To list all secondary external systems involved in the main scenario.", "To define the final outcome guaranteed by the system after an error occurs.", "To describe what must be true about the state of the system before the use case can start."], "answer": "D", "explanation": "Preconditions state the required system state or environmental conditions that must be satisfied before the use case begins execution."}, {"component": "W04.L2.C8", "lo_ids": ["CO2.LO3"], "bloom": 4, "question": "A reviewer examines a use case step stating: 'The system opens a red pop-up modal dialog to alert the user of insufficient funds.' What quality defect is present, and how should it be resolved?", "options": [], "answer": "This step exhibits a boundary leak by specifying concrete UI implementation details (red pop-up modal). It should be rewritten to focus on functional intent, such as 'The system notifies the user of insufficient funds.'", "explanation": "Use case quality checklists penalize UI design leaks (colors, pop-up modals) because specifications should remain technology-agnostic and testable at the functional level."}], "problems": []}, "week": 4}, {"lecture_id": "W04.L3", "topic": "Software requirements and requirements engineering", "minutes": 30, "status": "approved", "preset": "slides_only", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W04.L3.C1", "title": "Recap use case standards and spec guidelines", "minutes": 15, "kind": "concept", "bloom": 2, "way": "slides", "when": "in_class", "rule": "R5", "reason": "Slides cover IEEE 830, UML use case standards, and mandatory spec elements missing from video (3.5/15 min) and NotebookLM (80% coverage).", "alternative": null, "allowed": ["slides", "in_class", "youtube_bridge", "notebooklm"], "locked": false, "set_by": "ai", "prep_minutes": 15, "segments": [], "video_minutes": 0.0, "bridge": [], "coverage": 0.8, "uncovered": ["IEEE 830"], "simulation": null}, {"component": "W04.L3.C2", "title": "Identify actors and system boundaries", "minutes": 15, "kind": "mechanism", "bloom": 3, "way": "in_class", "when": "in_class", "rule": "D7", "reason": "In‑class activity lets students practice step‑by‑step actor extraction and boundary drawing on a prod nd system interactions", "To hide requirement documents from non-technical stakeholders", "To eliminate the need for software testing", "To mandate a specific programming language for developers"], "answer": "A", "explanation": "IEEE 830 guidelines focus on defining software requirements in terms of external interactions and functional behaviors without locking the design into specific low-level coding implementations."}, {"component": "W04.L3.C2", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "An e-commerce application sends transaction verification requests to an external payment gateway during checkout. How is the external payment gateway classified in this system's use case model?", "options": ["Primary actor inside the system boundary", "Use case action within the system process", "Secondary external actor outside the system boundary", "Internal actor within the system boundary"], "answer": "C", "explanation": "External services that interface with the system to fulfill a request are categorized as secondary actors residing outside the system boundary."}, {"component": "W04.L3.C2", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "A developer modeling an automated library system labels an internal database update script as an external primary actor. Is this classification accurate?", "options": ["Yes, because all background processes are treated as primary actors", "No, because database scripts must always be classified as human secondary actors", "No, because internal components reside within the system boundary and are not actors", "Yes, because automated scripts alter database state"], "answer": "C", "explanation": "Actors must be external entities interacting with the system across its boundary; internal software modules or automated scripts are part of the system itself."}], "problems": []}, "week": 4}, {"lecture_id": "W05.L1", "topic": "Software requirements and requirements engineering", "minutes": 150, "status": "approved", "preset": "slides_only", "pres system process", "Secondary external actor outside the system boundary", "Internal actor within the system boundary"], "answer": "C", "explanation": "External services that interface with the system to fulfill a request are categorized as secondary actors residing outside the system boundary."}], "questions": [{"component": "W05.L1.C1", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "You are parsing an unstructured product description for an e-commerce platform. Which requirement statement correctly represents a precondition in the functional template?", "options": ["The item stock count is decremented in the inventory database.", "The user clicks the Submit Order button on the confirmation page.", "The user must have an active account with a verified email address before initiating checkout.", "The system sends a confirmation email after payment succeeds."], "answer": "C", "explanation": "A precondition defines the mandatory state that must hold true before the user goal or action can begin, such as having a verified active account."}, {"component": "W05.L1.C2", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "A developer writes the following step in a main success scenario: '3. System authenticates user credentials, generates a session token, and updates user profile statistics.' Why does this step violate spec guidelines?", "options": ["It combines multiple operations into one step instead of keeping steps atomic and observable.", "Main success scenarios must only contain user actions, not system responses.", "It references a database token which is forbidden in requirements.", "It lacks an actor name in the sentence structure."], "answer": "A", "explanation": "Spec-driven guidelines require each step in a main success scenario to be atomic and observable rather than bundling multiple system actions into a single step."}, {"component": "W05.L1.C3", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "In a flight booking use case, step 4 of the main success scenario is 'User submits credit card details.' How should an expired card error be documented to maintain clear traceability?", "options": ["Add an extension branch tied to step 4, designated as '4a. Credit card is expired.'", "List card expiration checks in the use case postconditions.", "Create a completely independent use case titled 'Handle Expired Credit Card'.", "Embed an IF-THEN conditional block directly inside step 4 of the main success scenario."], "answer": "A", "explanation": "Extensions use the numbering scheme of the main scenario step they branch from (e.g., 4a) to preserve traceability to the exact point of divergence."}, {"component": "W05.L1.C4", "lo_ids": ["CO2.LO1"], "bloom": 3, "question": "While drawing a UML context diagram for a course registration system, a student places the university's central OAuth identity provider inside the system boundary box. What is wrong with this placement?", "options": ["Context diagrams cannot include third-party integrations.", "Software systems belong inside the boundary; only human users are drawn outside.", "Identity providers should only be represented in database ER diagrams.", "External services and identity providers must be drawn outside the system boundary as external actors."], "answer": "D", "explanation": "The system boundary separates the system being built from external systems and actors, which must be placed outside the boundary box."}, {"component": "W05.L1.C5", "lo_ids": ["CO2.LO1"], "bloom": 4, "question": "A software team is planning the first release of a healthcare app. A proposed use case allows users to customize the UI accent color scheme. Under MoSCoW prioritization for launch, how should this use case be classified?", "options": ["Should Have", "Must Have", "Could Have", "Won't Have"], "answer": "C", "explanation": "A cosmetic feature like UI customization offers non-essential value and is classified as 'Could Have' (desirable but not critical for the first release)."}, {"component": "W05.L1.C6", "lo_ids": ["CO2.LO1"], "bloom": 4, "question": "During a use case review, an auditor flags the step: 'System processes the patient record fast and securely.' Which quality checklist criterion does this step fail?", "options": ["Precondition validity", "Testability", "Completeness", "Actor identification"], "answer": "B", "explanation": "Ambiguous, subjective terms like 'fast' and 'securely' cannot be verified objectively, failing the testability check."}, {"component": "W05.L1.C7", "lo_ids": ["CO2.LO1"], "bloom": 2, "question": "In a spec-driven development pipeline, how does a use case main success scenario directly map to downstream testing artifacts?", "options": ["It maps to executable feature files containing Given-When-Then acceptance criteria.", "It becomes infrastructure provisioning scripts.", "It transforms into low-level architectural class diagrams.", "It converts into database schema migration files."], "answer": "A", "explanation": "Use case scenarios map directly to feature files with acceptance criteria (Given-When-Then format) in spec-driven testing frameworks."}, {"component": "W05.L1.C9", "lo_ids": ["CO2.LO1"], "bloom": 4, "question": "A peer review of a banking application specification shows 'Junior Admin', 'Senior Admin', and 'System Lead' performing identical steps in the 'Reset Password' use case. What pitfall should be corrected?", "options": ["Vague step wording", "Boundary leakage", "Missing exception handling", "Actor overload"], "answer": "D", "explanation": "Listing multiple separate actor titles for identical interactions creates actor overload; they should be consolidated into a single generalized actor role."}], "problems": []}, "week": 5}, {"lecture_id": "W05.L2", "topic": "Spec-driven development frameworks", "minutes": 30, "status": "approved", "preset": "slides_notebooklm", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W05.L2.C1", "title": "Foundations of Spec-Driven Development Frameworks", "minutes": 15, tion": "How does Spec-Driven Development (SDD) fundamentally differ from traditional Test-Driven Development (TDD)?", "options": ["SDD eliminates the need for testing entirely by relying on static evaluation.", "SDD decouples the interface contract from language-specific code using formal specs as the single source of truth.", "TDD relies on machine-readable schemas, whereas SDD relies strictly on manual code reviews.", "SDD requires implementation code to be written before defining interface contracts."], "answer": "B", "explanation": "SDD establishes formal, machine-readable specifications as the single source of truth prior to implementation, decoupling interface contracts from language-specific test scripts."}, {"component": "W05.L2.C1", "lo_ids": ["CO2.LO2"], "bloom": 2, "question": "Why are executable specifications particularly useful when integrating Large Language Models (LLMs) into the development workflow?", "options": ["They allow LLMs to automatically write documentation without checking data types.", "They translate natural language requests directly into machine assembly without code.", "They provide an unambiguous machine-readable benchmark for LLMs to enforce architectural and interface consistency.", "They eliminate the need for prompt engineering by running code directly in the database."], "answer": "C", "explanation": "Executable specifications provide a clear, machine-readable single source of truth that LLMs and static analyzers use to validate and enforce API interface consistency."}, {"component": "W05.L2.C2", "lo_ids": ["CO2.LO2"], "bloom": 2, "question": "What is the primary benefit of defining input constraints and response schemas in frameworks like JSON Schema or TypeSpec before writing implementation code?", "options": ["It guarantees that database queries execute with optimal performance at runtime.", "It eliminates the need for HTTP request handling in web frameworks.", "It automatically deploys application code to production cloud servers.", "It enables automated contract validation of public interfaces before any backend code is generated."], "answer": "D", "explanation": "Machine-readable schemas define public interface signatures and constraints upfront, allowing automated validation of contracts prior to writing implementation code."}, {"component": "W05.L2.C2", "lo_ids": ["CO2.LO2"], "bloom": 2, "question": "What role do preconditions and postconditions play within an executable specification schema?", "options": [], "answer": "They define structural input constraints and expected response signatures, enabling automated contract validation before code implementation.", "explanation": "Preconditions and postconditions explicitly constrain allowed inputs and valid output structures within machine-readable specs, ensuring interface compliance automatedly."}], "problems": []}, "week": 5}, {"lecture_id": "W06.L1", "topic": "Spec-driven development frameworks", "minutes": 90, "status": "approved", "preset": "slides_only", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W06.L1.C1", "title": "Mapping Natural Language Requirements to Interface Contracts", "minutes": 15, "kind": "worked_example", "bloom": 3, "way": "slides", "when": "in_class", "rule": "R5", "reason": "Slides present step-by-step conversion of NL requirements to method signatures, replacing partial 4.5-minute video coverage and missing type annotation details.", "alternative": null, "allowed": ["slides", "in_class", "youtube_bridge"], "locked": false, "set_by": "ai", "prep_minutes": 15, "segments": [], "video_minutes": 0.0, "bridge": [], "coverage": 0.4, "uncovered": ["Precondition Mapping", "Postcondition Mapping", "Type Annotations"], "simulation": null}, {"component": "W06.L1.C2", "title": "Specifying Preconditions, Postconditions, and Invariants", "minutes": 15, "kind": "mechanism", "bloom": 3, "way": "slides", "when": "in_class", "rule": "R5", "reason": "Slides provide exact mathematical notation for precond is the primary benefit of defining input constraints and response schemas in frameworks like JSON Schema or TypeSpec before writing implementation code?", "options": ["It guarantees that database queries execute with optimal performance at runtime.", "It eliminates the need for HTTP request handling in web frameworks.", "It automatically deploys application code to production cloud servers.", "It enables automated contract validation of public interfaces before any backend code is generated."], "answer": "D", "explanation": "Machine-readable schemas define public interface signatures and constraints upfront, allowing automated validation of contracts prior to writing implementation code."}], "questions": [{"component": "W06.L1.C1", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "You need to convert an informal requirement—'Calculate discount based on user age and loyalty points, failing gracefully on invalid inputs'—into an unambiguous contract for an AI code generator. Which interface specification best achieves this?", "options": ["def calculate_discount(age: int, points: int) -> float (raises ValueError for negative inputs)", "def calculate_discount(age: str, points: str) -> int", "def calculate_discount(age, points)", "def calculate_discount(user_info: dict) -> any"], "answer": "A", "explanation": "Specifying precise type annotations (`int -> float`) and explicit exception behavior (`raises ValueError`) eliminates ambiguity in method signatures, preventing runtime errors during AI code generation."}, {"component": "W06.L1.C2", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "In a Design by Contract specification for a BankAccount class, a developer asserts that `balance >= 0` must evaluate to true before and after any public method execution. What type of contract constraint is this?", "options": ["Class Invariant", "Precondition", "Postcondition", "Input Boundary Condition"], "answer": "A", "explanation": "A condition that must always remain true before and after the execution of every public method in a module is a class invariant."}, {"component": "W06.L1.C3", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "An automated testing tool reads an executable contract and generates hundreds of randomized integer inputs to verify that a sorting method always returns a sorted list. Which technique is the framework demonstrating?", "options": ["Static Code Linting", "Mock Server Simulation", "Property-Based Test Generation", "Manual Unit Testing"], "answer": "C", "explanation": "Executable specifications allow frameworks to automatically synthesize property-based tests that validate general rules across wide ranges of generated inputs."}, {"component": "W06.L1.C4", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "When translating a multi-method payment gateway module into an executable specification file, how can a developer ensure complete requirement coverage across public interfaces?", "options": ["Combine all requirements into a single generic interface signature", "Define request validation schemas, expected return types, and explicit error states for every public method", "Write informal docstrings describing the business workflow inside the code file", "Rely on the LLM to dynamically generate edge-case validation checks at runtime"], "answer": "B", "explanation": "Translating module requirements into executable specs requires mapping each business rule to concrete validation schemas, public signatures, and explicit error states for full coverage."}, {"component": "W06.L1.C5", "lo_ids": ["CO2.LO2"], "bloom": 4, "question": "A development team notices that an LLM code generator frequently fails to produce working code because the executable specification defines exact private helper variable names and internal loop mechanics. What specification design mistake did the team make?", "options": ["Failing to handle contract drift across software versions", "Omitting property-based compliance checks", "Under-specifying public method stcondition", "Input Boundary Condition"], "answer": "A", "explanation": "A condition that must always remain true before and after the execution of every public method in a module is a class invariant."}, {"component": "W06.L1.C3", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "An automated testing tool reads an executable contract and generates hundreds of randomized integer inputs to verify that a sorting method always returns a sorted list. Which technique is the framework demonstrating?", "options": ["Static Code Linting", "Mock Server Simulation", "Property-Based Test Generation", "Manual Unit Testing"], "answer": "C", "explanation": "Executable specifications allow frameworks to automatically synthesize property-based tests that validate general rules across wide ranges of generated inputs."}], "questions": [{"component": "W06.L2.C1", "lo_ids": ["CO2.LO2"], "bloom": 2, "question": "A requirement states: 'A user cannot withdraw an amount exceeding their current balance.' In contract-based design, how is this constraint formally classified for the withdraw method?", "options": ["As an implicit parameter signature definition", "As a postcondition that guarantees the balance becomes zero after execution", "As a precondition that must be satisfied by the caller before invoking withdraw", "As a class invariant that applies only when the system shuts down"], "answer": "C", "explanation": "Preconditions specify the criteria and obligations that must be true prior to invoking a method, such as validating that the requested withdrawal amount does not exceed the balance."}, {"component": "W06.L2.C2", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "You are defining a pytest-bdd scenario for an e-commerce checkout module. Which action correctly belongs in the step implementation of a 'Given' clause?", "options": ["Asserting that the database record status equals COMPLETED", "Initializing a user account with an active balance and populating their shopping cart", "Handling an exception thrown during payment processing", "Calling the checkout() API method on the cart object"], "answer": "B", "explanation": "In spec-driven BDD frameworks, 'Given' steps set up the required initial context and state before any action or triggering event occurs."}, {"component": "W06.L2.C3", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "A payment system requirement specifies that attempting to charge an expired credit card must raise an ExpiredCardException. How should an assertion harness systematically verify this requirement?", "options": ["By asserting that the method returns a null transaction ID", "By updating the card expiration date inside the postcondition assertion block", "By verifying that the account balance remains unchanged after calling a non-existent method", "By executing the API call within an assertion harness configured to expect ExpiredCardException"], "answer": "D", "explanation": "Translating exception requirements into executable specifications requires wrapping the target method call in an assertion harness that validates the expected exception is raised."}, {"component": "W06.L2.C4", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "An LLM tasked with generating executable BDD step definitions frequently invents non-existent method signatures. Which prompting strategy directly mitigates these interface hallucinations?", "options": ["Instructing the LLM to omit assertions from the generated test code", "Asking the LLM to generate plain natural-language summaries before code generation", "Removing key preconditions and postconditions from the prompt text", "Anchoring the system prompt with explicit interface schemas and method signatures"], "answer": "D", "explanation": "Schema anchoring provides explicit method signatures and parameter contracts in the prompt, constraining the LLM to generate specs using real, verified interfaces."}, {"component": "W06.L2.C5", "lo_ids": ["CO2.LO2"], "bloom": 3, "question": "Before the core logic h scripted queries and LLM summarisation.", "Scripted querying should be avoided because it cannot count occurrence frequencies in large files.", "LLM summarisation guarantees zero false positives when extracting specific error codes compared to scripted tools.", "Scripted querying provides deterministic accuracy for specific codes, whereas LLM summarisation can introduce false positives."], "answer": "D", "explanation": "Scripted querying (e.g., grep, jq) offers precise code extraction without false positives, whereas LLM-assisted summarisation carries a risk of hallucinations despite being fast for high-level summaries."}, {"component": "W10.L1.C6", "lo_ids": ["CO3.LO2"], "bloom": 5, "question": "You have identified a root cause from a trace log and are structuring a failure report for developers. Which approach ensures the findings are validated and actionable?", "options": ["Request developers to re-run the trace manually without providing cited line numbers.", "Rely entirely on stakeholder opinions rather than log verification.", "Validate the cause with a reproducing unit test and link actionable fixes to specific log evidence.", "Provide high-level developer advice without linking back to specific log lines."], "answer": "C", "explanation": "Actionable reporting requires direct traceability back to log evidence combined with concrete validation methods such as reproducing unit tests."}], "problems": []}, "week": 10}, {"lecture_id": "W10.L2", "topic": "Automated testing and evaluation mechanisms", "minutes": 90, "status": "approved", "preset": "slides_notebooklm", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W10.L2.C1", "title": "AI-native architectures and testing challenges", "minutes": 10, "kind": "concept", "bloom": 2, "way": "slides", "when": "in_class", "rule": "R5", "reason": "Video 2.4/10 min; missing model drift, data‑driven behavior, test oracle; NotebookLM 40% coverage.", "alternative": null, "allowed": ["slides", "in_class", " }], "questions": [{"component": "W12.L1.C1", "lo_ids": ["CO4.LO2"], "bloom": 2, "question": "Why is it necessary to map automated testing pipeline stages back to explicit reliability requirements before evaluating a pipeline?", "options": ["It eliminates the need for manual code reviews in multi-component software factories.", "It replaces the need for defining Service-Level Objectives across AI services.", "It ensures every test stage directly validates at least one target reliability objective rather than testing arbitrarily.", "It automatically guarantees zero downstream production failures regardless of test quality."], "answer": "C", "explanation": "Mapping pipeline stages to explicit reliability requirements ensures that test design decisions directly serve specific system reliability objectives rather than performing redundant or unaligned testing."}, {"component": "W12.L1.C2", "lo_ids": ["CO4.LO2"], "bloom": 3, "question": "An AI-native application relies on three cascading microservices. If upstream Service A fails, it triggers downstream failures in Services B and C. Which mechanism should be incorporated into the reliability specification to mitigate this?", "options": ["Increase the error budget of Service C to absorb model drift.", "Increase the test coverage threshold of Service B's unit tests to 100%.", "Replace all automated integration tests with manual end-to-end checks.", "Define a cascade failure policy such as circuit breaking or fallback responses between services."], "answer": "D", "explanation": "Formalizing a cascade failure policy (e.g., using circuit breakers or fallbacks) prevents an upstream failure in a multi-component AI system from causing dependent downstream services to fail."}, {"component": "W12.L1.C3", "lo_ids": ["CO4.LO2"], "bloom": 4, "question": "An engineering team instrumented their production AI pipeline with real-time dynamic data profiling, but observed a significant increase in pipeline execution cost and latency. What trade-off is demonstrated in this case study?", "options": ["Deterministic output generation vs. stochastic model training speed.", "High test coverage vs. zero security vulnerability detection.", "Deep operational observability vs. resource consumption and execution latency.", "Automated integration testing vs. manual test writing effort."], "answer": "C", "explanation": "Instrumenting deep observability in production pipelines often improves visibility into reliability failures, but comes at the expense of higher resource utilization and execution delays."}, {"component": "W12.L1.C4", "lo_ids": ["CO4.LO2"], "bloom": 5, "question": "In assessing a pipeline design decision to run heavy end-to-end model validation on every git commit, an evaluator finds developer delivery speed has dropped significantly. How should this design decision be re-justified against reliability requirements?", "options": ["Move heavy model validation to a pre-release or nightly trigger while keeping fast unit tests on every commit.", "Lower the accuracy thresholds of the heavy validation tests so they finish running faster.", "Retain the heavy test stage on every commit to maintain maximum theoretical test rigor regardless of velocity cost.", "Remove all end-to-end model validation entirely from the deployment pipeline."], "answer": "A", "explanation": "Aligning pipeline design decisions with reliability goals requires balancing feedback speed and rigor; tiering expensive validation tests to pre-release triggers preserves developer feedback loops while meeting reliability requirements."}, {"component": "W12.L1.C5", "lo_ids": ["CO4.LO2"], "bloom": 5, "question": "During peer review of a multi-component AI pipeline, Group A notices that Group B justified skipping integration testing between the parser and recommender services because both pass unit tests. Why is this justification inadequate?", "options": ["Peer review guidelines require every single component to have identical deployment scripts.", "Skipping integration testing violates the system's error budget tracking rules.", "Unit tests run slower than integration tests in multi-component pipelines.", "Isolated unit tests cannot verify cross-component contract failures, schema mismatches, or cascading errors between AI services."], "answer": "D", "explanation": "In multi-component AI factories, passing unit tests in isolation fails to validate inter-service interactions, data drift handling, and contract compatibility, making integration testing necessary for reliability justification."}, {"component": "W12.L1.C6", "lo_ids": ["CO4.LO2"], "bloom": 4, "question": "A team needs to lower deployment latency for critical security hotfixes in an AI service. When comparing exhaustive model regression testing against high deployment speed, which strategy best manages this trade-off for urgent fixes?", "options": ["Bypass all pipeline checks and deploy directly to production without testing.", "Double the error budget so that broken deployments do not count against service level objectives.", "Run full synthetic model evaluation suites before deploying any hotfix.", "Execute a targeted subset of regression tests for affected components, deferring full model suites to post-deployment staging."], "answer": "D", "explanation": "To balance deployment speed against testing depth during urgent hotfixes, teams run targeted test suites focused on impacted components while scheduling full, resource-intensive validation suites post-deployment."}], "problems": []}, "week": 12}, {"lecture_id": "W12.L2", "topic": "Deployment and reliability metric evaluation", "minutes": 90, "status": "approved", "preset": "full_mix", "preset_by": "ai", "course_style": "mix", "parts": [{"component": "W12.L2.C1", "title": "Key deployment metrics overview", "minutes": 15, "kind": "concept", "bloom": 2, "way": "youtube_bridge", "when": "in_class", "rule": "R3", "reason": "Video clips cover 9.2/15 min; professor supplements missing latency,  <div><b>${t.slides}′</b><span>taught live</span></div><div><b>${t.in_class+t.simulation}′</b><span>activity / simulation</span></div><div><b>${m.prep_minutes}′</b><span>professor's prep</span></div></div></div>`;
 h+=`<div class="card"><table><tr><th>Part</th><th>Min</th><th>Way</th><th>Rule</th><th>Why, and the evidence</th></tr>`+m.parts.map(p=>{
   let ev=[];if(p.segments.length)ev.push(p.segments.map(s=>`<a href="${esc(s.url)}" target="_blank">${s.start}–${s.end} ${esc(s.video).slice(0,48)}</a> (${s.verdict==="teaches_fully"?"fully":"partly"})`).join("; "));
   if(p.bridge.length)ev.push("Bridge slides add: "+esc(p.bridge.slice(0,4).join("; ")));
   if(p.coverage!=null)ev.push(`NotebookLM sources cover ${Math.round(p.coverage*100)}% of key terms`+(p.uncovered.length?` (missing: ${esc(p.uncovered.slice(0,4).join(", "))})`:""));
   if(p.simulation)ev.push("Simulation: "+esc(p.simulation.title));
   if(p.alternative)ev.push("Alternative: "+(LBL[p.alternative.way]||p.alternative.way));
   return `<tr><td><b>${p.component.split(".").pop()}</b> ${esc(p.title)}<div class="ev">${p.kind.replace("_"," ")} · Bloom ${p.bloom}</div></td><td>${p.minutes}</td>
   <td>${chip(p.way)}${p.when==="pre_class"?'<br><span class="pre">before class</span>':""}${p.locked?'<br><span class="pre">locked</span>':""}</td><td class="ev">${RULE[p.rule]||p.rule}</td>
   <td>${esc(p.reason)}<div class="ev">${ev.join("<br>")}</div></td></tr>`}).join("")+`</table></div>`;
 if(m.checks.length)h+=`<div class="card"><b>Lecture checks</b><ul class="notes">${m.checks.map(c=>`<li><code>${c.code}</code> ${esc(c.message)}</li>`).join("")}</ul></div>`;
 const q=m.quiz;if(q){const qs=(arr,t)=>arr.map((x,k)=>`<div class="q">${k+1}. ${esc(x.question)} <span class="ev">(${x.component.split(".").slice(-1)}, Bloom ${x.bloom})</span>${x.options.length?`<ol type="A">${x.options.map(o=>`<li>${esc(o)}</li>`).join("")}</ol>`:""}<details><summary>Answer</summary><span class="ans">${esc(x.answer)}</span> ${esc(x.explanation)}</details></div>`).join("");
  h+=`<div class="card"><b>Recap (${q.minutes.recap} min) and review quiz (${q.minutes.quiz} min)</b>${q.recap.length?`<h4>Recap of the previous lecture</h4>${qs(q.recap)}`:""}<h4>Review quiz</h4>${qs(q.questions)}</div>`}
 document.getElementById("main").innerHTML=h;window.scrollTo(0,0)}
show(0);
</script></body></html>
