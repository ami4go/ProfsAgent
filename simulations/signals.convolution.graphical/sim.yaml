id: signals.convolution.graphical
type: [2-parameter-explorer]
title: "Graphical convolution · try it yourself"
summary: "Type your own x(t) and h(t) or pick an example; slide t to watch h flip and slide, the product shaded, and y(t) drawn as the area."
version: 1.2.0
status: team-checked              # draft | team-checked | retired  (professor approval is per course, in the app)
courses: [ECE250]
topics: [convolution, LTI systems, impulse response, flip and slide]
interactivity: L4                 # values and the student's own functions
engine: {name: manim-web, version: 0.40.1, licence: MIT}
files: {page_src: page.src.html, qa: qa.py, video_src: video/graphical_convolution.py}
config:
  parameters: [{name: W, min: 0.5, max: 4, default: 2}, {name: a, min: 0.2, max: 3, default: 1}, {name: t, min: -4, max: 10, default: 1}]
  functions: [x(t), h(t)]
  examples: [pulse ∗ exponential, pulse ∗ pulse, exponential ∗ exponential, triangle ∗ pulse, sine burst ∗ moving average]
checks:
  independent: "live: the area at t integrated on its own grid vs the full discrete convolution sum, plus the exact answer for 3 examples"
  qa: "parser (18 formulas, 7 broken ones); accuracy over 3 examples x 16 settings x 32 values of t; Play, flip, phone width, offline"
  video: "the Manim scene refuses to render unless areas match the formula (2e-8) and numpy's convolution (1e-3)"
sensitive: false
offline: true
class_example: true                # the app can save a professor's setup as the class example (page reports its state)
changelog:
  - {version: 1.2.0, date: 2026-11-03, by: Amit, change: "the setup (example or own functions, W, a, t) is kept in the link and sent to the app, which can save it as a professor's class example; a link opens that setup"}
  - {version: 1.1.0, date: 2026-11-01, by: Amit, change: "u(0) = 1/2 and steps robust to rounding, so the checks agree to 0.0006"}
  - {version: 1.0.0, date: 2026-10-31, by: Amit, change: "first interactive version (manim-web); Manim video from 2026-10-29"}
