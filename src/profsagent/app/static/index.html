<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfsAgent</title>
<style>
:root{--navy:#002357;--navy2:#1E3A6E;--navy-bg:#EEF1F8;--canvas:#F8F8F6;--band:#F5F3ED;--card:#FFFFFF;--line:#E8E5DC;--ink:#1F1E1D;--ink2:#5E5D59;--muted:#6B6B6B;
  --teal:#006970;--teal-bg:#E5F3F3;--amber:#B45309;--amber-bg:#FEF3C7;--green:#15803D;--green-bg:#DCFCE7;--red:#B91C1C;--red-bg:#FEE2E2}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
h1{font-size:24px;line-height:1.3;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
p{margin:0}
a{color:var(--navy2)}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--band);color:var(--ink2);white-space:nowrap}
.sys{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.band{background:var(--band);border-bottom:1px solid var(--line);padding:10px 24px}
.band-in{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{max-width:860px;margin:0 auto;padding:28px 24px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.row,.row:first-child{border-top:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:38px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--band)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy2)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn.bad{border-color:#FCA5A5;color:#7F1D1D}.btn.bad:hover{background:var(--red-bg)}
.btn.big{padding:13px 20px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--navy2);text-decoration:underline;cursor:pointer;font-weight:500}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.amber{background:var(--amber-bg);color:var(--amber)}.chip.green{background:var(--green-bg);color:var(--green)}
.chip.grey{background:var(--band);color:var(--ink2);border:1px solid var(--line)}.chip.teal{background:var(--teal-bg);color:var(--teal)}
.chip.navy{background:var(--navy-bg);color:var(--navy2)}.chip.red{background:var(--red-bg);color:var(--red)}
.banner{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.banner.green{background:var(--green-bg);color:#14532D}.banner.amber{background:var(--amber-bg);color:#78350F}.banner.navy{background:var(--navy-bg);color:var(--navy)}.banner.red{background:var(--red-bg);color:#7F1D1D}
label.f{display:block;font-weight:500;margin:14px 0 4px}
label.f .opt{font-weight:400;color:var(--ink2)}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid #C9D4EA;border-color:var(--navy2)}
.btn:focus-visible,.link:focus-visible,.tog:focus-visible,.stars button:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
.err{color:var(--red);font-size:13px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tog{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tog.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.check input{width:17px;height:17px;margin-top:2px;flex:none;accent-color:var(--navy)}
.steps{display:flex;gap:8px;align-items:center;margin:0 auto;max-width:860px;padding:14px 24px 0}
.step{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.step .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.step.done{color:var(--green)}.step.done .dot{background:var(--green-bg);border-color:var(--green-bg);color:var(--green)}
.step.cur{color:var(--navy);font-weight:600}.step.cur .dot{background:var(--navy);border-color:var(--navy);color:#fff}
.sep{flex:1;height:1px;background:var(--line);max-width:80px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 24px;z-index:5}
.foot-in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--band);border:1px solid var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--navy);transition:width .6s ease}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:20px;font-weight:600}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.center{text-align:center}
.slist{list-style:none;padding:0;margin:12px 0 0}
.slist li{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13.5px;color:var(--muted)}
.slist li.done{color:var(--green)}.slist li.cur{color:var(--navy);font-weight:600}
.slist .mk{width:18px;text-align:center;flex:none}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
pre.log{background:#1F1E1D;color:#E8E5DC;border-radius:8px;padding:10px 12px;overflow:auto;font-size:12px;white-space:pre-wrap;margin:8px 0 0}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
.co{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fff}
.co ul{margin:8px 0 0;padding-left:18px}.co li{margin:3px 0}
.pos{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.str{letter-spacing:1px;color:var(--navy2)}
.iss{margin-top:6px;font-size:13px;border-radius:8px;padding:6px 10px}
.iss.warning{background:var(--amber-bg);color:#78350F}.iss.error{background:var(--red-bg);color:#7F1D1D}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow-wrap:normal}
.ref{font:500 11.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2);background:var(--band);border-radius:5px;padding:1px 6px;overflow-wrap:anywhere}
.card,.co,.banner{overflow-wrap:anywhere}
.stars{display:inline-flex;gap:2px}.stars button{border:0;background:none;font-size:20px;cursor:pointer;color:#C9C6BC;padding:0 2px}.stars button.on{color:#D97706}
.fbrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fbrow:first-of-type{border-top:0}
.proposal{font-size:13.5px;overflow-x:auto}.proposal table{border-collapse:collapse;margin:8px 0}.proposal td,.proposal th{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.proposal h1{font-size:20px}.proposal h2{margin-top:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:90vw}
.notice{border:1px solid #F5D78E;background:#FFFDF5;border-radius:10px;padding:12px 14px;margin-top:10px}
.ainote{margin-top:6px;font-size:13px;background:var(--teal-bg);color:#0B3D40;border-radius:8px;padding:7px 10px}
input.aifield,textarea.aifield,select.aifield{border-color:#7FC4C7;background:#F7FCFC}
@media (max-width:720px){.g3,.g2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding:10px 14px}.wrap{padding:22px 16px 140px}.band,.foot{padding-left:16px;padding-right:16px}.steps{padding:14px 16px 0}}
/* lecture delivery (phase 2) */
.wrap.wide{max-width:1120px}
.nav{display:flex;gap:4px;margin-left:14px}.nav a{font-size:13.5px;color:var(--ink2);text-decoration:none;padding:6px 10px;border-radius:8px}.nav a:hover{background:var(--band)}.nav a.on{color:var(--navy);font-weight:600;background:var(--navy-bg)}
.crumbs{font-size:13px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumbs a{color:var(--navy2)}
.chip.star{background:#FFF4D6;color:#8A5300;border:1px solid #F5D78E}
.btn.ok{border-color:#86EFAC;color:#14532D}.btn.ok:hover{background:var(--green-bg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.filters select{width:auto;min-width:150px;padding:6px 8px}
.week{margin-top:18px}.week h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.lec{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:8px;text-decoration:none;color:var(--ink)}
.lec:hover{border-color:#C9C6BC;background:#FDFDFC}
.lec .lid{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--navy2)}
.lec .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.lec .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}.stats b{color:var(--ink);font-weight:600}
.grid2x{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 26px}
.kv h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin:0 0 4px}.kv ul{margin:0;padding-left:18px}.kv li{margin:2px 0}
.summary{font-size:15px;line-height:1.65}
.choice{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}.choice.on{border-color:var(--navy2);background:#FAFBFE}
.choice>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.choice>label input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--navy)}
.choice .sub{margin:10px 0 0 28px;padding-top:10px;border-top:1px dashed var(--line)}.choice .sub.off{opacity:.45;pointer-events:none}
.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.subrow label{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer}
.subrow input[type=checkbox]{accent-color:var(--navy)}
.subrow input[type=url],.subrow input[type=text]{width:auto}
.who-owns{font-size:11.5px;color:var(--ink2);margin-left:auto;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:7px 13px;cursor:pointer;min-width:40px}.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.prog{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}.prog:first-of-type{border-top:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.rcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;background:#fff}.rcard.approved{border-color:#86EFAC;background:#FBFFFC}
.rhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rank{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2);background:var(--band);border-radius:6px;padding:2px 7px;flex:none}
.rtitle{font-weight:600;font-size:15px;line-height:1.35}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2);margin-top:4px;align-items:center}
.score{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:help}
.score .sb{width:70px;height:6px;border-radius:99px;background:var(--band);overflow:hidden;display:inline-block}.score .sb i{display:block;height:100%;background:var(--teal)}
.why{margin-top:8px;font-size:13.5px}
.revbox{margin-top:8px;background:var(--band);border-radius:8px;padding:8px 10px;font-size:13.5px}
.cover{margin-top:8px;font-size:13px}
.warn{margin-top:8px;background:var(--amber-bg);color:#78350F;border-radius:8px;padding:7px 10px;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.reason{margin-top:8px}
.groupt{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;gap:10px;flex-wrap:wrap}.groupt h3{margin:0}
.reviewbar{background:var(--band);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kit h1{font-size:20px}.kit h2{margin-top:18px}.kit ul,.kit ol{padding-left:20px}.kit li{margin:3px 0}
.inv{white-space:pre-wrap;background:var(--band);border-radius:8px;padding:14px;font-size:13.5px;border:1px solid var(--line)}
.yt{margin-top:10px;aspect-ratio:16/9;width:100%;max-width:520px;border:0;border-radius:8px}
@media (max-width:820px){.grid2x{grid-template-columns:minmax(0,1fr)}.lec{grid-template-columns:minmax(0,1fr)}.lec .right{align-items:flex-start;flex-direction:row;flex-wrap:wrap}.choice .sub{margin-left:0}.nav{margin-left:4px}}
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading…</p></div>
<script>
(function () {
'use strict';
const ICON = {
  check: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  cross: '<svg class="ico" viewBox="0 0 24 24" style="color:var(--red)"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  alert: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  arrow: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  down: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  link: '<svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  big: '<svg viewBox="0 0 24 24" style="width:56px;height:56px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><path d="M7 12l3.5 3.5L17 9"/></svg>'
};
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ext = (url, text) => url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + ' ' + ICON.link + '</a>' : esc(text);
const hhmm = t => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const day = t => new Date(t * 1000).toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + hhmm(t);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const app = document.getElementById('app');

async function api(path, opts) {
  try { const r = await fetch(path, opts); let data = null; try { data = await r.json(); } catch (e) {} return { ok: r.ok, status: r.status, data }; }
  catch (e) { return { ok: false, status: 0, data: { problem: 'The app is not responding. Is it still running on this laptop?' } }; }
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
let toastTimer = null;
function toast(msg) { const t = document.getElementById('toast') || Object.assign(document.createElement('div'), { id: 'toast', className: 'toast', role: 'status' });
  t.textContent = msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000); }

let OPT = null, HEALTH = null, PAGE = 'home', RUNS = [], RUN = null, RID = null, FORM = null, ERRS = {}, UI = {}, poll = null, tick = null;

// ============================== chrome ==============================
function header() {
  let sys = '';
  if (HEALTH) {
    const kg = HEALTH.kg_backend === 'neo4j' ? (HEALTH.neo4j ? '<span class="chip green">Course database connected</span>' : '<span class="chip red">Course database not running</span>')
                                              : '<span class="chip amber">Sample course data (stub)</span>';
    const keys = HEALTH.keys.gemini + HEALTH.keys.groq;
    sys = kg + (keys ? '' : ' <span class="chip red">No AI keys in .env</span>') + (HEALTH.working_on ? ' <span class="chip navy"><span class="spin"></span> Working</span>' : '');
  }
  const inD = PAGE.startsWith('d');
  return '<div class="top"><div style="display:flex;align-items:center;flex-wrap:wrap"><button class="brand" data-act="home"><span class="logo">IIIT</span>ProfsAgent</button>' +
    '<nav class="nav"><a href="#/"' + (inD ? '' : ' class="on"') + '>Course design</a><a href="#/delivery"' + (inD ? ' class="on"' : '') + '>Lecture delivery</a></nav></div><div class="sys">' + sys + '</div></div>';
}
const foot = (left, right) => '<div class="foot"><div class="foot-in"><div style="display:flex;gap:8px;flex-wrap:wrap">' + left + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + right + '</div></div></div>';
const STATUS = {
  queued: ['grey', 'Waiting to start'], running: ['navy', 'Working'], waiting: ['amber', 'Waiting for you'], paused: ['amber', 'Paused: AI quota'],
  error: ['red', 'Needs attention'], done: ['green', 'Approved'], stopped: ['grey', 'Stopped by you']
};
const GATE_NAME = { gate0_details: 'Details', gate1_context: 'Context', gate2_outcomes: 'Outcomes', gate3_proposal: 'Final sheet' };
const statusChip = r => { const s = STATUS[r.status] || ['grey', r.status]; return '<span class="chip ' + s[0] + '">' + s[1] + (r.status === 'waiting' && r.gate ? ': ' + GATE_NAME[r.gate] : '') + '</span>'; };

// ============================== home ==============================
function home() {
  const list = RUNS.length ? RUNS.map(r => '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px;font-weight:600">' + esc(r.title) + '</b>' + statusChip(r) + '</div>' +
      '<p class="muted small" style="margin-top:2px">Started ' + day(r.created_at) + (r.status === 'paused' && r.resume_at ? ' · continues by itself at ' + hhmm(r.resume_at) : '') + '</p>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px"><button class="link small" style="color:var(--red)" data-act="delete" data-rid="' + esc(r.run_id) + '" data-title="' + esc(r.title) + '">Delete</button>' +

let bgTimer = null;

  const r = DV.results[lid]; if (!r) return null;
  const a = DV.survey[lid] || {}; let pending = 0, approved = 0;
  if (yes(a, 'assistance')) D_KINDS.forEach(([k]) => { if (yes(a, KIND_WANT[k])) (r.items[k] || []).forEach(x => x.approved ? approved++ : pending++); });
  if (yes(a, 'guest_lecture') && r.experts && r.experts.experts) r.experts.experts.forEach(x => x.approved ? approved++ : pending++);
  approved += ((DV.own || {})[lid] || []).length;
  return { pending, approved, removed: ((DV.actions || {})[lid] || []).filter(x => x.decision !== 'approve').length };
}
function dstatus(lid) {
  const a = DV.survey[lid]; if (!a) return ['Not decided', 'grey'];
  const j = djob(lid);
  if (j && j.state === 'running') return ['Searching…', 'navy'];
  if (j && j.state === 'queued') return ['Waiting to start', 'grey'];
  if (j && j.state === 'error') return ['Problem', 'red'];
  const wantsC = yes(a, 'assistance') || yes(a, 'guest_lecture'), wantsB = yes(a, 'attach_material') || yes(a, 'generate_material');
  if (wantsC && DV.results[lid]) { const c = dcounts(lid); return c.pending ? ['Ready for review · ' + c.pending, 'amber'] : ['Reviewed', 'green']; }
  if (wantsC) return ['Not started', 'grey'];
  if (wantsB) return ['Waiting for the material team', 'grey'];
  return ['Covered (own material)', 'green'];
}

  let body = '';

function md(src) {
  const lines = src.split('\n'), out = []; let list = null, para = [];
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush = () => { if (para.length) { out.push('<p style="margin-top:8px">' + inline(para.join(' ')) + '</p>'); para = []; } if (list) { out.push('</' + list + '>'); list = null; } };
  lines.forEach(ln => {
    let m;
    if (/^#\s/.test(ln)) { flush(); out.push('<h1>' + inline(ln.slice(2)) + '</h1>'); }
    else if (/^##\s/.test(ln)) { flush(); out.push('<h2>' + inline(ln.slice(3)) + '</h2>'); }
    else if ((m = ln.match(/^\s*-\s+(.*)/))) { if (para.length) flush(); if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = ln.match(/^\d+\.\s+(.*)/))) { if (para.length) flush(); if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if (/^\s{2,}\S/.test(ln) && list) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, '<br><span class="small muted">' + inline(ln.trim()) + '</span></li>'); }
    else if (!ln.trim()) flush();
    else para.push(ln.trim());
  });
  flush(); return out.join('');
}

async function loadDelivery(first) {
  clearTimeout(dpoll);
  const asked = DRID;
  const r = await api(dapi(''));
  if (!PAGE.startsWith('d') || asked !== DRID) return;
  if (!r.ok) { app.innerHTML = header() + '<div class="wrap"><h1>Lecture delivery is not available</h1><p class="muted">' + esc((r.data && (r.data.detail || r.data.problem)) || '') + '</p><a class="btn" href="#/delivery" style="margin-top:12px">Lecture delivery</a></div>'; return; }
  DV = r.data;
  if (first) { try { Object.assign(PUI.filter, JSON.parse(store.get('profsagent-dfilter-' + DRID) || '{}')); } catch (e) {} }
  const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) && app.contains(document.activeElement);
  if (typing && !first) dPendingRender = true; else render();
  if (dbusy()) dpoll = setTimeout(() => loadDelivery(false), 4000);
}

  PUI.openReason = null;
  toast(decision === 'approve' ? (kind === 'experts' ? 'Shortlisted' : 'Approved') : decision === 'replace' ? 'Replaced with the next-best item' : 'Rejected');
  await loadDelivery(false); return true;
}
async function dsave() {
  const lid = DLID, d = ddraft(lid);
  PUI.saving = true; PUI.errs = {}; render();
  const r = await api(dapi('/survey/' + encodeURIComponent(lid)), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) });
  PUI.saving = false;
  if (r.status === 422) { PUI.errs = r.data.errors || {}; render(); const e = app.querySelector('.err'); if (e) e.scrollIntoView({ block: 'center' }); return; }
  if (!r.ok) { toast((r.data && r.data.problem) || 'Could not save'); render(); return; }
  delete PUI.draft[lid];
  toast(r.data.start_c ? (r.data.refresh ? 'Saved. Searching again with the new choices.' : 'Saved. The search has started.') : 'Choices saved.');
  await loadDelivery(false);
}
async function dupload(files) {
  if (!files || !files.length) return;
  const fd = new FormData(); [...files].forEach(f => fd.append('files', f));
  toast('Uploading…');
  const r = await api(dapi('/attachments/' + encodeURIComponent(DLID)), { method: 'POST', body: fd });
  if (!r.ok) { toast((r.data && r.data.detail) || 'Upload failed'); return; }
  const d = ddraft(DLID); d.attachments = d.attachments.concat(r.data.saved); delete PUI.errs.attach; render(); toast('Attached. Press Save to keep it.');
}
async function dclick(act, b) {
  const lid = DLID;
  if (act === 'd-example') { b.disabled = true; const r = await post('/api/delivery/example'); if (r.ok) location.hash = '#/delivery/' + r.data.run_id; else { b.disabled = false; toast((r.data && r.data.detail) || 'Could not copy the example'); } return; }
  if (act === 'd-save') return dsave();
  if (act === 'd-start') { const r = await post(dapi('/start'), { lectures: [lid], refresh: b.dataset.refresh === '1' }); toast(r.ok && r.data.started.length ? 'The search has started.' : 'Nothing to search: choose resources or a guest first.'); return loadDelivery(false); }
  if (act === 'd-sameprev') { const r = await api(dapi('/previous/' + encodeURIComponent(lid))); if (!r.ok) { toast((r.data && r.data.problem) || 'Not available'); return; } PUI.draft[lid] = Object.assign(dblank(), r.data.answers); PUI.errs = {}; render(); toast('Filled in from the previous lecture. Press Save to keep it.'); return; }
  if (act === 'd-bulk') { const r = await post(dapi('/bulk'), { lid, scope: b.dataset.scope }); if (!r.ok) { toast((r.data && r.data.problem) || 'Could not apply'); return; } toast(r.data.applied.length ? 'Applied to ' + r.data.applied.length + ' lecture' + (r.data.applied.length === 1 ? '' : 's') + ' without choices: ' + r.data.applied.join(', ') : 'Every lecture there already has choices; nothing changed.'); return loadDelivery(false); }
  if (act === 'd-addlink') { const el = document.getElementById('attlink'); const v = (el && el.value || '').trim(); if (!/^https?:\/\/\S+$/.test(v)) { toast('Paste a link that starts with http'); return; } ddraft(lid).attachments.push(v); delete PUI.errs.attach; render(); return; }
  if (act === 'd-rmatt') { ddraft(lid).attachments.splice(+b.dataset.i, 1); render(); return; }
  if (act === 'd-approve') return dreview(lid, b.dataset.kind, b.dataset.key, 'approve', '', b.dataset.title);
  if (act === 'd-askreason') { PUI.openReason = { kind: b.dataset.kind, key: b.dataset.key, title: b.dataset.title, decision: b.dataset.decision, text: '' }; render(); const t = document.getElementById('rs'); if (t) t.focus(); return; }
  if (act === 'd-cancelreason') { PUI.openReason = null; render(); return; }
  if (act === 'd-confirmreason') { const o = PUI.openReason; if (!o.text || !o.text.trim()) { o.err = 'Write a short reason first'; render(); return; } return dreview(lid, o.kind, o.key, o.decision, o.text, o.title); }
  if (act === 'd-undo') { await post(dapi('/undo'), { lid, kind: b.dataset.kind, key: b.dataset.key }); toast('Back to waiting for your decision'); return loadDelivery(false); }
  if (act === 'd-toggle') { PUI.show[b.dataset.id] = !PUI.show[b.dataset.id]; render(); return; }
  if (act === 'd-play') { PUI.show['play' + b.dataset.key] = true; render(); return; }
  if (act === 'd-ownopen') { PUI.ownForm = { lid, title: '', url: '', kind: 'reading' }; render(); return; }
  if (act === 'd-ownclose') { PUI.ownForm = null; render(); return; }
  if (act === 'd-ownsave') { const f = PUI.ownForm; const r = await post(dapi('/own'), { lid, title: f.title, url: f.url, kind: f.kind }); if (!r.ok) { f.err = (r.data && r.data.problem) || 'Could not add'; render(); return; } PUI.ownForm = null; toast('Added as approved'); return loadDelivery(false); }
  if (act === 'd-ownrm') { await post(dapi('/own'), { lid, remove: +b.dataset.i }); return loadDelivery(false); }
  if (act === 'd-health') { await post(dapi('/health')); toast('Checking every approved link. This takes a minute.'); return loadDelivery(false); }
  if (act === 'd-deadreplace') return dreview(lid, b.dataset.kind, b.dataset.key, 'replace', 'The link no longer works', b.dataset.title);
  if (act === 'd-deaddismiss') { await post(dapi('/health/dismiss'), { url: b.dataset.url }); return loadDelivery(false); }
  if (act === 'd-report') { if (PUI.report) { PUI.report = null; render(); return; } const r = await api(dapi('/report')); PUI.report = r.ok ? r.data.html : '<p class="muted">No course report yet: it is written after the first search.</p>'; render(); return; }
  if (act === 'd-copyinv') { const t = document.getElementById('invtext').innerText; try { await navigator.clipboard.writeText(t); toast('Invitation copied. Paste it into your email.'); } catch (e) { toast('Select the text and copy it'); } return; }
  if (act === 'd-rate') { const r = await post(dapi('/rate'), { lid: b.dataset.lid, key: b.dataset.key, title: b.dataset.title, rating: +b.dataset.n }); toast(r.ok ? 'Rating saved. Thank you.' : ((r.data && r.data.problem) || 'Could not save')); return loadDelivery(false); }
}
function dinput(t) {
  if (t.id === 'dnote' && DLID) { ddraft(DLID).note = t.value; return true; }
  if (t.id === 'rs' && PUI.openReason) { PUI.openReason.text = t.value; PUI.openReason.err = null; return true; }
  if (PUI.ownForm && ['ownt', 'ownu', 'ownk'].includes(t.id)) { PUI.ownForm[{ ownt: 'title', ownu: 'url', ownk: 'kind' }[t.id]] = t.value; return true; }
  return false;
}
function dchange(t) {
  if (t.dataset.filter) { PUI.filter[t.dataset.filter] = t.type === 'checkbox' ? t.checked : t.value; store.set('profsagent-dfilter-' + DRID, JSON.stringify(PUI.filter)); render(); return true; }
  if (PAGE !== 'dlec') return false;
  const d = ddraft(DLID);
  if (t.dataset.choice) { d[t.dataset.choice] = t.checked ? 'yes' : 'no'; PUI.errs = {}; render(); return true; }
  if (t.dataset.want) { d[t.dataset.want] = t.checked ? 'yes' : 'no'; delete PUI.errs.wants; render(); return true; }
  if (t.dataset.task) { d.attach_tasks = t.checked ? d.attach_tasks.concat(t.dataset.task) : d.attach_tasks.filter(x => x !== t.dataset.task); delete PUI.errs.tasks; render(); return true; }
  if (t.id === 'attfile') { dupload(t.files); return true; }
  if (t.id === 'ownk' && PUI.ownForm) { PUI.ownForm.kind = t.value; return true; }
  return false;
}

// ============================== routing and loading ==============================
function render() {
  const y = window.scrollY;
  dPendingRender = false;
  app.innerHTML = PAGE === 'form' ? form() : PAGE === 'run' ? runPage() : PAGE === 'dhome' ? dhome() : PAGE === 'dlist' ? dlist() :
    PAGE === 'dlec' ? dlec() : PAGE === 'dkit' ? dkit() : PAGE === 'dstudent' ? dstudent() : home();
  window.scrollTo(0, y);
  if (PAGE === 'form' || (PAGE === 'run' && FORM)) lookupBackground();
  if (PAGE === 'run') startCountdown();
}
function startCountdown() {
  clearInterval(tick);
  if (!RUN || RUN.status !== 'paused' || !RUN.resume_at) return;
  const upd = () => { const el = document.getElementById('countdown'); if (!el) return; const s = Math.max(0, Math.round(RUN.resume_at - Date.now() / 1000));
    el.textContent = s > 0 ? 'in ' + (s >= 3600 ? Math.floor(s / 3600) + ' h ' : '') + Math.floor(s % 3600 / 60) + ' min' : 'any moment now'; };
  upd(); tick = setInterval(upd, 15000);
}
async function loadHealth() { const r = await api('/api/health'); if (r.ok) HEALTH = r.data; }
async function loadRun(first) {
  clearTimeout(poll);
  const asked = RID;
  const r = await api('/api/runs/' + encodeURIComponent(RID));
  if (PAGE !== 'run' || asked !== RID) return;
  if (!r.ok) { app.innerHTML = header() + '<div class="wrap"><h1>Course not found</h1><p class="muted">' + esc((r.data && (r.data.detail || r.data.problem)) || '') + '</p><a class="btn" href="#/" style="margin-top:12px">Your courses</a></div>'; return; }
  await loadHealth();
  if (PAGE !== 'run' || asked !== RID) return;
  const prevKey = RUN ? RUN.status + RUN.gate : '';
  RUN = r.data;
  if (first || prevKey !== RUN.status + RUN.gate) {
    UI = { fb: { ratings: {}, change: '', time_saved: '' } }; ERRS = {};
    FORM = RUN.status === 'waiting' && RUN.gate === 'gate0_details' && RUN.view ? Object.assign(BLANK(), JSON.parse(JSON.stringify(RUN.view.form))) : null;
    if (!first) window.scrollTo(0, 0);
  }
  if (RUN.status === 'done' && first) { const f = await api('/api/runs/' + encodeURIComponent(RID) + '/feedback'); if (f.ok && f.data.entries.length) UI.fb.previous = f.data.entries.length; }
  render();
  if (['queued', 'running'].includes(RUN.status)) poll = setTimeout(() => loadRun(false), 3000);
  else if (RUN.status === 'paused') poll = setTimeout(() => loadRun(false), 30000);
}
let routeId = 0;
async function route() {
  clearTimeout(poll); clearInterval(tick); clearTimeout(dpoll);
  const me = ++routeId;
  const h = location.hash.replace(/^#/, '') || '/';
  if (!OPT) { const o = await api('/api/options'); OPT = o.data; }
  await loadHealth();
  if (me !== routeId) return;   // the professor already went somewhere else
  if (h === '/new') {
    PAGE = 'form'; ERRS = {}; UI = {};
    let d = null; try { d = JSON.parse(store.get('profsagent-draft') || 'null'); } catch (e) {}
    FORM = Object.assign(BLANK(), d || {});
    render(); window.scrollTo(0, 0);
  } else if (h === '/delivery') {
    PAGE = 'dhome'; DCOURSES = null; const r = await api('/api/delivery'); if (me !== routeId) return; DCOURSES = r.ok ? r.data : { courses: [] }; render(); window.scrollTo(0, 0);
  } else if (h.startsWith('/delivery/')) {
    const parts = h.slice(10).split('/').map(decodeURIComponent);
    if (DRID !== parts[0]) { DV = null; PUI.draft = {}; PUI.tab = {}; PUI.show = {}; PUI.report = null; }
    DRID = parts[0]; DLID = parts[1] && parts[1] !== 'student' ? parts[1] : null;
    PAGE = parts[1] === 'student' ? 'dstudent' : parts[2] === 'kit' ? 'dkit' : DLID ? 'dlec' : 'dlist';
    PUI.errs = {}; PUI.openReason = null; PUI.ownForm = null; PUI.kit = null;
    if (PAGE === 'dkit') { const k = await api(dapi('/kit/' + encodeURIComponent(DLID))); PUI.kit = k.ok ? k.data.md : ''; }
    if (me !== routeId) return;
    if (!DV) app.innerHTML = header() + '<div class="wrap"><p class="muted">Loading the lectures…</p></div>';
    await loadDelivery(true); window.scrollTo(0, 0);
  } else if (h.startsWith('/run/')) {
    PAGE = 'run'; RID = decodeURIComponent(h.slice(5)); RUN = null; render(); await loadRun(true);
  } else {
    PAGE = 'home'; const r = await api('/api/runs'); if (me !== routeId) return; RUNS = r.ok ? r.data : []; render(); window.scrollTo(0, 0);
    if (RUNS.some(x => ['queued', 'running'].includes(x.status))) poll = setTimeout(route, 10000);
  }
}
window.addEventListener('hashchange', route);

// ============================== events ==============================
app.addEventListener('input', ev => {
  const t = ev.target;
  if (PAGE.startsWith('d') && dinput(t)) return;
  if (t.dataset.f && FORM) { FORM[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if (ERRS[t.dataset.f]) { delete ERRS[t.dataset.f]; const e = app.querySelector('[data-err="' + t.dataset.f + '"]'); if (e) e.remove(); }
    saveDraft(); if (t.dataset.f === 'background') lookupBackground(); }
  if (t.dataset.ui) UI[t.dataset.ui] = t.value;
  if (t.dataset.fb) UI.fb[t.dataset.fb] = t.value;
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (PAGE.startsWith('d') && dchange(t)) return;
  if (t.dataset.f && FORM) { FORM[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; delete ERRS[t.dataset.f]; saveDraft(); }
  if (t.dataset.fb) UI.fb[t.dataset.fb] = t.value;
});
app.addEventListener('toggle', ev => { if (ev.target.hasAttribute && ev.target.hasAttribute('data-log')) UI.logOpen = ev.target.open;
  if (ev.target.dataset && ev.target.dataset.dlog) PUI.logOpen[ev.target.dataset.dlog] = ev.target.open; }, true);
app.addEventListener('focusout', () => { if (dPendingRender) setTimeout(() => { if (dPendingRender && !(document.activeElement && app.contains(document.activeElement) && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) render(); }, 0); });
app.addEventListener('click', async ev => {
  if (PAGE === 'dlec') {
    const cf = ev.target.closest('[data-conf]'); if (cf) { ddraft(DLID).confidence = +cf.dataset.conf; render(); return; }
    const tb = ev.target.closest('[data-dtab]'); if (tb) { PUI.tab[DLID] = tb.dataset.dtab; render(); return; }
  }
  const b = ev.target.closest('[data-act],[data-tog]'); if (!b) return;
  if (b.dataset.act && b.dataset.act.startsWith('d-')) { await dclick(b.dataset.act, b); return; }
  if (b.dataset.tog) { const k = b.dataset.tog, v = b.dataset.v, arr = FORM[k]; const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v);
    if (k === 'assess_pref' && i < 0) FORM.assess_avoid = FORM.assess_avoid.filter(x => x !== v); if (k === 'assess_avoid' && i < 0) FORM.assess_pref = FORM.assess_pref.filter(x => x !== v);
    delete ERRS[k]; saveDraft(); render(); return; }
  const a = b.dataset.act;
  if (a === 'home') { location.hash = '#/'; return; }
  if (a === 'delete') {
    if (!window.confirm('Delete “' + b.dataset.title + '”?\n\nIt is moved to the Deleted folder (runs/_deleted), so it can be recovered, and removed from the course database. If it is being worked on, that work stops.')) return;
    b.disabled = true;
    const r = await api('/api/runs/' + encodeURIComponent(b.dataset.rid), { method: 'DELETE' });
    if (!r.ok) { b.disabled = false; toast((r.data && (r.data.detail || r.data.problem)) || 'Could not delete'); return; }
    toast('Deleted. It is in runs/_deleted if you need it back.');
    if (location.hash === '#/' || location.hash === '') route(); else location.hash = '#/';
    return;
  }
  if (a === 'example') { FORM = Object.assign(BLANK(), JSON.parse(JSON.stringify(OPT.example))); ERRS = {}; saveDraft(); render(); toast('Example filled in. Change anything you like.'); return; }
  if (a === 'start') {
    UI.sending = true; render();
    const r = await post('/api/runs', FORM);
    UI.sending = false;
    if (r.status === 422) { ERRS = r.data.errors || {}; render(); const first = app.querySelector('.err'); if (first) first.scrollIntoView({ block: 'center' }); toast('Please fix the marked fields'); return; }
    if (!r.ok) { render(); toast((r.data && r.data.problem) || 'Could not start'); return; }
    store.set('profsagent-draft', ''); location.hash = '#/run/' + r.data.run_id; return;
  }
  if (a === 'stopopen') { UI.stopOpen = true; UI.err = ''; render(); const t = document.getElementById('stopwhy'); if (t) t.focus(); return; }
  if (a === 'stopcancel') { UI.stopOpen = false; UI.err = ''; render(); return; }
  if (a === 'approve' || a === 'reject') {
    const comment = a === 'reject' ? (UI.stopWhy || '') : (UI.comment || '');
    if (a === 'reject' && !comment.trim()) { UI.err = 'Say briefly why you are stopping'; render(); return; }
    if (a === 'approve' && RUN.problems && RUN.problems.blocked && !comment.trim()) { UI.err = 'Give a reason for continuing despite the open problems'; render(); return; }
    UI.sending = true; UI.err = ''; render();
    const body = { gate: RUN.gate, decision: a, comment };
    if (RUN.gate === 'gate0_details' && a === 'approve') body.values = FORM;
    const r = await post('/api/runs/' + encodeURIComponent(RID) + '/decision', body);
    UI.sending = false;
    if (r.status === 422) { ERRS = r.data.errors || {}; render(); const first = app.querySelector('.err'); if (first) first.scrollIntoView({ block: 'center' }); toast('Some details are still missing'); return; }
    if (!r.ok) { UI.err = (r.data && r.data.problem) || 'Could not send'; render(); return; }
    toast(a === 'approve' ? (RUN.gate === 'gate0_details' ? 'Details confirmed. ProfsAgent starts designing the course.' : 'Thanks. ProfsAgent continues with the next part.') : 'Stopped.'); window.scrollTo(0, 0); await loadRun(true); return;
  }
  if (a === 'retry') { const r = await post('/api/runs/' + encodeURIComponent(RID) + '/retry'); if (!r.ok) toast((r.data && r.data.problem) || 'Could not restart'); await loadRun(true); return; }
  if (a === 'proposal') { if (UI.proposal) { UI.proposal = null; render(); return; } const r = await api('/api/runs/' + encodeURIComponent(RID) + '/proposal'); UI.proposal = r.ok ? r.data.html : '<p class="err">Not available yet</p>'; render(); return; }
  if (a === 'again') { const r = await api('/api/runs/' + encodeURIComponent(RID) + '/form'); if (r.ok) { store.set('profsagent-draft', JSON.stringify(r.data)); location.hash = '#/new'; toast('The form is filled in from this run. Change what you need.'); } return; }
  if (a === 'rate') { UI.fb.ratings[b.dataset.k] = +b.dataset.n; render(); return; }
  if (a === 'fbagain') { UI.fb = { ratings: {}, change: '', time_saved: '' }; render(); return; }
  if (a === 'fbsend') {
    const r = await post('/api/runs/' + encodeURIComponent(RID) + '/feedback', { ratings: UI.fb.ratings, change: UI.fb.change, time_saved: UI.fb.time_saved, by: RUN.by });
    if (!r.ok) { UI.fb.err = (r.data && r.data.problem) || 'Could not save'; render(); return; }
    UI.fb = { ratings: {}, change: '', time_saved: '', sent: true }; render(); toast('Feedback saved. Thank you.'); return;
  }
});
route();
})();
</script>
