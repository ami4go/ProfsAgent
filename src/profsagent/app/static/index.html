<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfsAgent</title>
<style>
/* ProfsAgent design system (docs/10_ui_improvement_plan.md §5): calm minimalism; tokens first, then components.
   Fonts are bundled (static/fonts, OFL), so the app looks the same offline. */
@font-face{font-family:'Atkinson Hyperlegible Next';src:url(/fonts/atkinson-hyperlegible-next-latin.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(/fonts/bricolage-grotesque-latin.woff2) format('woff2');font-weight:200 800;font-stretch:75% 100%;font-style:normal;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/fonts/jetbrains-mono-latin.woff2) format('woff2');font-weight:100 800;font-style:normal;font-display:swap}
:root{
  /* neutrals: cool paper, white cards */
  --paper:#F3F5F7;--card:#FFFFFF;--sunken:#EEF1F4;--line:#E2E6EB;--line-strong:#C9D0D8;--ink:#16202C;--ink2:#4B5665;--ink3:#5F6B79;--field:#808A97;
  /* action: IIIT-D navy */
  --navy:#0A2F5C;--navy2:#123F78;--navy-bg:#E8EEF7;--focus:#5B8DEF;
  /* status: one meaning each */
  --ok:#16803C;--ok-ink:#14532D;--ok-bg:#E3F4E8;--ok-line:#9ED9B0;
  --warn:#9A5205;--warn-ink:#7A3E04;--warn-bg:#FDF1DC;--warn-line:#EFCB8E;
  --err:#B42318;--err-ink:#7F1D1D;--err-bg:#FDE7E4;--err-line:#F2B1A9;
  --info:#0A6F7E;--info-ink:#0B3D40;--info-bg:#E2F3F5;--info-line:#8FCDD5;
  /* ways of teaching a part (the class-time bar); always shown with a text label */
  --w-slides:#2F6FEB;--w-video:#B35F00;--w-nlm:#6B48F0;--w-inclass:#137A55;--w-sim:#087C8C;--w-quiz:#677281;
  /* type */
  --f-body:'Atkinson Hyperlegible Next','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --t-xs:12px;--t-sm:13px;--t-md:14px;--t-base:15px;--t-lg:17px;--t-xl:22px;--t-2xl:30px;
  /* shape, depth, motion */
  --r-sm:6px;--r-md:9px;--r-lg:14px;--r-pill:999px;
  --shadow-1:0 1px 2px rgba(16,24,40,.05);--shadow-2:0 10px 30px rgba(16,24,40,.14);
  --ease-out:cubic-bezier(.22,1,.36,1);--dur-1:140ms;--dur-2:220ms;
  /* older names, kept so every screen keeps working */
  --canvas:var(--paper);--band:var(--sunken);--muted:var(--ink3);
  --teal:var(--info);--teal-bg:var(--info-bg);--amber:var(--warn);--amber-bg:var(--warn-bg);--green:var(--ok);--green-bg:var(--ok-bg);--red:var(--err);--red-bg:var(--err-bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--t-base)/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
h1{font:600 var(--t-2xl)/1.15 var(--f-display);margin:0 0 6px;letter-spacing:-.015em}
h2{font-size:var(--t-lg);font-weight:600;margin:0 0 10px;letter-spacing:-.005em}
h3{font-size:var(--t-md);font-weight:600;margin:0 0 6px}
p{margin:0}
a{color:var(--navy2);text-underline-offset:2px}
.muted{color:var(--ink2)}.small{font-size:var(--t-sm)}.tiny{font-size:var(--t-xs)}
.mono,.lid,.ref,.rank,code{font-family:var(--f-mono)}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;font:600 11px var(--f-mono);display:flex;align-items:center;justify-content:center}
.pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--sunken);color:var(--ink2);white-space:nowrap}
.sys{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.band{background:var(--card);border-bottom:1px solid var(--line);padding:10px 28px}
.band-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wrap{max-width:880px;margin:0 auto;padding:32px 28px 140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow-1)}
.card.flat{border:0;box-shadow:none;padding:0;background:transparent}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.card h2+.row,.row:first-child{border-top:0}
/* buttons: primary (one per screen) · secondary (default) · quiet · good/bad */
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--r-md);padding:8px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:38px;text-decoration:none;color:var(--ink);
  transition:background-color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.btn:hover{background:var(--sunken)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--navy2);padding-left:8px;padding-right:8px}.btn.quiet:hover{background:var(--navy-bg)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:var(--t-sm)}
.btn.bad{border-color:var(--err-line);color:var(--err-ink)}.btn.bad:hover{background:var(--err-bg)}
.btn.ok{border-color:var(--ok-line);color:var(--ok-ink)}.btn.ok:hover{background:var(--ok-bg)}
.btn.big{padding:13px 22px;font-size:var(--t-base);border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:3px 0;min-height:24px;color:var(--navy2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600}
/* chips: at most two per item; colour = meaning (green done, amber needs you, navy working/info, grey neutral, red stopped) */
.chip{font-size:var(--t-xs);font-weight:600;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.chip .ico{width:13px;height:13px;vertical-align:0}
.chip.amber{background:var(--warn-bg);color:var(--warn-ink)}.chip.green{background:var(--ok-bg);color:var(--ok-ink)}
.chip.grey{background:var(--sunken);color:var(--ink2)}.chip.teal{background:var(--info-bg);color:var(--info-ink)}
.chip.navy{background:var(--navy-bg);color:var(--navy2)}.chip.red{background:var(--err-bg);color:var(--err-ink)}
.chip.star{background:var(--warn-bg);color:var(--warn-ink)}
.banner{border-radius:var(--r-lg);padding:13px 16px;display:flex;gap:10px;align-items:flex-start;margin-top:16px;border:1px solid transparent}
.banner + h1,.banner + h2{margin-top:22px}
.banner.green{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}.banner.amber{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.banner.navy{background:var(--navy-bg);color:var(--navy)}.banner.red{background:var(--err-bg);color:var(--err-ink);border-color:var(--err-line)}
label.f{display:block;font-weight:600;margin:16px 0 5px;font-size:var(--t-md)}
label.f .opt{font-weight:400;color:var(--ink2)}
input[type=text],input[type=url],textarea,select{width:100%;border:1px solid var(--field);border-radius:var(--r-md);background:#fff;padding:9px 11px;transition:border-color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px var(--navy-bg)}
.btn:focus-visible,.link:focus-visible,.tog:focus-visible,.stars button:focus-visible,.tab:focus-visible,.nav a:focus-visible,a.lec:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.err{color:var(--err);font-size:var(--t-sm);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tog{font-size:var(--t-sm);padding:6px 13px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:#fff;cursor:pointer;transition:background-color var(--dur-1) var(--ease-out)}
.tog.on{background:var(--navy);border-color:var(--navy);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;margin-top:10px}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--navy)}
.steps{display:flex;gap:10px;align-items:center;margin:0 auto;max-width:880px;padding:16px 28px 0}
.step{display:flex;align-items:center;gap:7px;font-size:var(--t-md);font-weight:600;color:var(--ink3)}
.step .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);background:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);font-weight:700}
.step.done{color:var(--ok)}.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur{color:var(--navy)}.step.cur .dot{background:var(--navy);border-color:var(--navy);color:#fff}
.sep{flex:1;height:1.5px;background:var(--line);max-width:72px}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 28px;z-index:5}
.foot-in{max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;border-radius:var(--r-pill);background:var(--sunken);border:1px solid var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--navy);transition:width .6s var(--ease-out)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.tile b{display:block;font:600 22px var(--f-display)}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.center{text-align:center}
.slist{list-style:none;padding:0;margin:12px 0 0}
.slist li{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:var(--t-md);color:var(--ink3)}
.slist li.done{color:var(--ok)}.slist li.cur{color:var(--navy);font-weight:600}
.slist .mk{width:18px;text-align:center;flex:none}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp .9s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
pre.log{background:#16202C;color:#E6E9EE;border-radius:var(--r-md);padding:10px 12px;overflow:auto;font:12px/1.5 var(--f-mono);white-space:pre-wrap;margin:8px 0 0}
details summary{cursor:pointer;color:var(--ink2);font-size:var(--t-sm);font-weight:600}
.co{border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-top:10px;background:#fff}
.co ul{margin:8px 0 0;padding-left:18px}.co li{margin:3px 0}
.pos{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.str{letter-spacing:1px;color:var(--navy2)}
.iss{margin-top:6px;font-size:var(--t-sm);border-radius:var(--r-md);padding:7px 11px}
.iss.warning{background:var(--warn-bg);color:var(--warn-ink)}.iss.error{background:var(--err-bg);color:var(--err-ink)}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-md)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.t th{font-size:var(--t-xs);color:var(--ink3);font-weight:600;white-space:nowrap;overflow-wrap:normal;letter-spacing:.02em}
.ref{font-size:11.5px;font-weight:500;color:var(--ink2);background:var(--sunken);border-radius:var(--r-sm);padding:1px 6px;overflow-wrap:anywhere}
.card,.co,.banner{overflow-wrap:anywhere}
.stars{display:inline-flex;gap:2px}.stars button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--field);padding:0 4px;min-width:28px;min-height:32px}.stars button.on{color:#D97706}
.fbrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fbrow:first-of-type{border-top:0}
.proposal{font-size:var(--t-md);overflow-x:auto}.proposal table{border-collapse:collapse;margin:8px 0}.proposal td,.proposal th{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
.proposal h1{font-size:var(--t-xl)}.proposal h2{margin-top:18px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-md);font-size:var(--t-sm);font-weight:500;z-index:30;max-width:90vw;box-shadow:var(--shadow-2);animation:toast-in var(--dur-2) var(--ease-out)}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.notice{border:1px solid var(--warn-line);background:#FFFBF3;border-radius:var(--r-lg);padding:13px 15px;margin-top:10px}
.ainote{margin-top:6px;font-size:var(--t-sm);background:var(--info-bg);color:var(--info-ink);border-radius:var(--r-md);padding:7px 11px}
input.aifield,textarea.aifield,select.aifield{border-color:var(--info-line);background:#F7FCFC}
@media (max-width:720px){.g3,.g2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding:10px 14px}.wrap{padding:22px 16px 150px}.band,.foot{padding-left:16px;padding-right:16px}.steps{padding:14px 16px 0;flex-wrap:wrap;gap:6px 10px}.step{font-size:var(--t-sm)}h1{font-size:24px}}
/* lecture delivery */
.wrap.wide{max-width:1180px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.card-h h2{margin:0}
.edbox{border:1px solid var(--navy2);border-radius:var(--r-lg);padding:13px 15px;background:#FAFBFE;margin-top:8px}
.edrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}.edbox>.edrow:first-child{border-top:0}
.edrow>.grow{flex:1;min-width:0}
input[type=number]{width:96px;border:1px solid var(--field);border-radius:var(--r-md);background:#fff;padding:8px 10px}
.edbtns{display:flex;gap:4px;flex:none}
.icon-btn{border:1px solid var(--line-strong);background:#fff;border-radius:var(--r-sm);min-width:32px;height:32px;cursor:pointer;color:var(--ink2);font-size:14px}
.icon-btn:hover{background:var(--sunken)}.icon-btn.bad{color:var(--err)}
.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.edfoot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.nav{display:flex;gap:4px;margin-left:18px}.nav a{font-size:var(--t-md);font-weight:500;color:var(--ink2);text-decoration:none;padding:7px 12px;border-radius:var(--r-md);transition:background-color var(--dur-1) var(--ease-out)}
.nav a:hover{background:var(--sunken)}.nav a.on{color:var(--navy);font-weight:600;background:var(--navy-bg)}
.crumbs{font-size:var(--t-sm);color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.crumbs a{color:var(--navy2);display:inline-block;padding:3px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{font-size:var(--t-xs);color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.filters select{width:auto;min-width:150px;padding:6px 8px}
details.card > summary.reqsum{cursor:pointer;list-style-position:inside}details.card > summary.reqsum h2{display:inline;margin:0}
details.card[open] > summary.reqsum{margin-bottom:10px}details[open] > summary .needs{display:none}
.simopts{margin-top:10px;border-top:1px solid var(--line)}.simopt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}.simopt:last-child{border-bottom:0}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}.pager .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mixhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mixnotes{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:8px 12px;color:var(--warn-ink)}
.mixnotes p{margin:2px 0;display:flex;gap:6px;align-items:flex-start}
.mixt td{vertical-align:top}.mixt select{width:100%}.mixt tr.locked td{background:#F7F9FC}.mixt tr.mixfixed td{background:var(--sunken)}
.mixev{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.mixt .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mixfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:12px}.mixfoot textarea{width:100%}
.mixquiz{margin-top:12px}.mixquiz .qq{border-top:1px solid var(--line);padding:8px 0}.mixquiz ol{margin:4px 0 4px 20px;padding:0}
@media (max-width:820px){.mixfoot{grid-template-columns:minmax(0,1fr)}}
.week{margin-top:22px}.week h2{font-size:var(--t-xs);font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.lec{display:grid;grid-template-columns:64px minmax(0,1fr) 60px minmax(100px,220px) 310px;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;margin-top:8px;text-decoration:none;color:var(--ink);
  transition:border-color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
.lec:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.lec .lid{font-weight:600;font-size:12.5px;color:var(--navy2)}
.lec .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.lec .mins{font-size:var(--t-sm);color:var(--ink2);white-space:nowrap}
.lec.nobar{grid-template-columns:64px minmax(0,1fr) 60px 310px}
.lec .right{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink2);margin-top:8px}.stats b{color:var(--ink);font-weight:600}
.grid2x{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 28px}
.kv h3{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 4px}.kv ul{margin:0;padding-left:18px}.kv li{margin:3px 0}
.summary{font-size:var(--t-base);line-height:1.65;color:var(--ink2);max-width:760px}
.choice{border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-top:10px;transition:border-color var(--dur-1) var(--ease-out),background-color var(--dur-1) var(--ease-out)}.choice.on{border-color:var(--navy2);background:#FAFBFE}
.choice>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.choice>label input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--navy)}
.choice .sub{margin:10px 0 0 28px;padding-top:10px;border-top:1px dashed var(--line)}.choice .sub.off{display:none}
.subrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.subrow label{display:inline-flex;gap:6px;align-items:center;font-size:var(--t-sm);border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:5px 11px;background:#fff;cursor:pointer}
.subrow input[type=checkbox]{accent-color:var(--navy)}
.subrow input[type=url],.subrow input[type=text]{width:auto}
.who-owns{display:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:#fff}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:7px 14px;cursor:pointer;min-width:40px;font-weight:600;transition:background-color var(--dur-1) var(--ease-out)}.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}
.prog{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.prog:first-of-type{border-top:0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color var(--dur-1) var(--ease-out)}.tab:hover{color:var(--ink)}.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.rcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;margin-top:10px;background:#fff}.rcard.approved{border-color:var(--ok-line);background:#FBFEFC}
.rhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rank{font-size:12px;font-weight:600;color:var(--ink2);background:var(--sunken);border-radius:var(--r-sm);padding:2px 7px;flex:none}
.rtitle{font-weight:600;font-size:var(--t-base);line-height:1.35}
.rmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:var(--t-sm);color:var(--ink2);margin-top:5px;align-items:center}
.why{margin-top:8px;font-size:var(--t-md)}
.revbox{margin-top:8px;background:var(--sunken);border-radius:var(--r-md);padding:9px 11px;font-size:var(--t-md)}
.cover{margin-top:8px;font-size:var(--t-sm)}
.warn{margin-top:8px;background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-md);padding:8px 11px;font-size:var(--t-sm)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.reason{margin-top:8px}
.groupt{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;gap:10px;flex-wrap:wrap}.groupt h3{margin:0}
.reviewbar{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 15px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kit h1{font-size:var(--t-xl)}.kit h2{margin-top:18px}.kit ul,.kit ol{padding-left:20px}.kit li{margin:3px 0}
.inv{white-space:pre-wrap;background:var(--sunken);border-radius:var(--r-md);padding:14px;font-size:var(--t-md);border:1px solid var(--line)}
.yt{margin-top:10px;aspect-ratio:16/9;width:100%;max-width:520px;border:0;border-radius:var(--r-md)}
.slide{border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;margin-top:10px;background:#fff}
.slide .sh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink2)}
.slide h4{margin:4px 0 6px;font-size:var(--t-base);font-weight:600}.slide ul{margin:4px 0 0;padding-left:18px}.slide li{margin:2px 0;font-size:var(--t-md)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:var(--t-sm)}.flow .box{border:1px solid var(--info);background:var(--info-bg);color:var(--info-ink);border-radius:var(--r-sm);padding:4px 8px}
pre.code{background:#111827;color:#E5E7EB;border-radius:var(--r-md);padding:10px 12px;font:12px/1.5 var(--f-mono);overflow:auto;margin:8px 0 0;white-space:pre}
.quiz{margin-top:8px;background:var(--sunken);border-radius:var(--r-md);padding:9px 13px;font-size:var(--t-md)}.quiz ol{margin:6px 0 0;padding-left:20px}.quiz li.ans{color:var(--ok);font-weight:600}
/* the lecture page: a working column and an "about this lecture" side panel */
.lp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lp-aside{position:sticky;top:76px}
.lp-aside .card{margin-top:0}
.lp-aside .kv{padding:12px 0;border-top:1px solid var(--line)}.lp-aside .kv:first-of-type{border-top:0;padding-top:0}
.howcard{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:1100px){.lp{grid-template-columns:minmax(0,1fr)}.lp-aside{position:static}}
/* the class-time bar: how a lecture's minutes are spent (docs/10 §5) */
.ctb{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;gap:2px;min-width:80px}
.ctb span{display:block;height:100%;min-width:3px}
.ctb.big{height:32px;border-radius:10px;gap:3px;margin-top:8px}
.ctb.big span{border-radius:6px;color:#fff;font-size:var(--t-xs);font-weight:600;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.ctb span.pre{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 9px)}
.ctb.empty{border:1.5px dashed var(--line-strong);background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--sunken) 6px 8px)}
.w-slides{background:var(--w-slides)}.w-video{background:var(--w-video)}.w-nlm{background:var(--w-nlm)}.w-inclass{background:var(--w-inclass)}.w-sim{background:var(--w-sim)}.w-quiz{background:var(--w-quiz)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-xs);color:var(--ink2)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:820px){.grid2x{grid-template-columns:minmax(0,1fr)}.lec,.lec.nobar{grid-template-columns:minmax(0,1fr) auto}.lec .lid,.lec .mins{display:none}.lec .ctb{grid-column:1/-1;grid-row:2}.choice .sub{margin-left:0}.nav{margin-left:4px}.ctb.big span{font-size:0;padding:0}table.t{display:block;overflow-x:auto}}
/* simulations */
body.noscroll{overflow:hidden}
.simov{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.62);display:flex;justify-content:center;padding:14px;animation:fade-in var(--dur-2) var(--ease-out)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.simov-box{background:var(--card);border-radius:var(--r-lg);display:flex;flex-direction:column;width:100%;max-width:1440px;overflow:hidden;box-shadow:var(--shadow-2)}
.simov-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.simov-state{padding:8px 14px;font-size:var(--t-sm);color:var(--ink2);background:var(--sunken);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.simov iframe{flex:1;width:100%;min-height:0;border:0;background:#0F1117}
@media (max-width:720px){.simov{padding:0}.simov-box{border-radius:0}}
.fcard{display:grid;grid-template-columns:168px minmax(0,1fr);gap:14px;border:1px solid var(--line);border-radius:var(--r-lg);padding:11px;margin-top:8px;background:#fff}
.fcard.rej{opacity:.55}.fcard.ok{border-color:var(--ok-line);background:#FBFEFC}
.fshot{width:168px;height:105px;object-fit:cover;object-position:top;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sunken)}
.fnone{display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);color:var(--ink2)}
@media (max-width:720px){.fcard{grid-template-columns:minmax(0,1fr)}.fshot{width:100%;height:150px}}
table.ftable{border-collapse:collapse;margin-top:8px;font-size:var(--t-sm)}table.ftable td{border:1px solid var(--line);padding:3px 7px}table.ftable tr:first-child td{background:var(--sunken);font-weight:600}
/* motion: fewer and gentler for people who ask for it (fades stay, movement goes) */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important}.spin{animation:none}.toast{animation:fade-in var(--dur-2) linear}.btn:active:not(:disabled){transform:none}}
</style>

<body>
<div id="app"><p style="padding:24px">Loading…</p></div>
<script>
(function () {
'use strict';
const ICON = {
  check: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  cross: '<svg class="ico" viewBox="0 0 24 24" style="color:var(--red)"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  alert: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  arrow: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  down: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  link: '<svg class="ico" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  big: '<svg viewBox="0 0 24 24" style="width:56px;height:56px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><path d="M7 12l3.5 3.5L17 9"/></svg>'
};
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const ext = (url, text) => url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text) + ' ' + ICON.link + '</a>' : esc(text);
const hhmm = t => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const day = t => new Date(t * 1000).toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + hhmm(t);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const app = document.getElementById('app');

async function api(path, opts) {
  try { const r = await fetch(path, opts); let data = null; try { data = await r.json(); } catch (e) {} return { ok: r.ok, status: r.status, data }; }
  catch (e) { return { ok: false, status: 0, data: { problem: 'The app is not responding. Is it still running on this laptop?' } }; }
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
let toastTimer = null;
function toast(msg) { const t = document.getElementById('toast') || Object.assign(document.createElement('div'), { id: 'toast', className: 'toast', role: 'status' });
  t.textContent = msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000); }

let OPT = null, HEALTH = null, PAGE = 'home', RUNS = [], RUN = null, RID = null, FORM = null, ERRS = {}, UI = {}, poll = null, tick = null;

// ============================== chrome ==============================
function header() {
  let sys = '';
  if (HEALTH) {
    const kg = HEALTH.kg_backend === 'neo4j' ? (HEALTH.neo4j ? '' : '<span class="chip red">Course database not running</span>')
                                              : '<span class="chip amber">Sample course data (stub)</span>';
    const keys = HEALTH.keys.gemini + HEALTH.keys.groq;
    sys = kg + (keys ? '' : ' <span class="chip red">No AI keys in .env</span>') + (HEALTH.working_on ? ' <span class="chip navy"><span class="spin"></span> Working</span>' : '');
  }
  const inD = PAGE.startsWith('d'), inS = PAGE === 'sims';
  return '<header class="top"><div style="display:flex;align-items:center;flex-wrap:wrap"><button class="brand" data-act="home"><span class="logo">IIIT</span>ProfsAgent</button>' +
    '<nav class="nav" aria-label="Sections"><a href="#/"' + (inD || inS ? '' : ' class="on" aria-current="page"') + '>Course design</a><a href="#/delivery"' + (inD ? ' class="on" aria-current="page"' : '') + '>Lecture delivery</a>' +
    '<a href="#/simulations"' + (inS ? ' class="on" aria-current="page"' : '') + '>Simulations</a></nav></div><div class="sys">' + sys + '</div></header>';
}
const foot = (left, right) => '<div class="foot"><div class="foot-in"><div style="display:flex;gap:8px;flex-wrap:wrap">' + left + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + right + '</div></div></div>';
const STATUS = {
  queued: ['grey', 'Waiting to start'], running: ['navy', 'Working'], waiting: ['amber', 'Waiting for you'], paused: ['amber', 'Paused: AI quota'],
  error: ['red', 'Needs attention'], done: ['green', 'Approved'], stopped: ['grey', 'Stopped by you']
};
const GATE_NAME = { gate0_details: 'Details', gate1_context: 'Context', gate2_outcomes: 'Outcomes', gate3_proposal: 'Final sheet' };
const statusChip = r => { const s = STATUS[r.status] || ['grey', r.status]; return '<span class="chip ' + s[0] + '">' + s[1] + (r.status === 'waiting' && r.gate ? ': ' + GATE_NAME[r.gate] : '') + '</span>'; };

// ============================== home ==============================
function home() {
  const firstWait = (RUNS.find(x => x.status === 'waiting') || {}).run_id;          // one primary per screen: the oldest thing waiting on you
  const list = RUNS.length ? RUNS.map(r => '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:16px;font-weight:600">' + esc(r.title) + '</b>' + statusChip(r) + '</div>' +
      '<p class="muted small" style="margin-top:2px">Started ' + day(r.created_at) + (r.status === 'paused' && r.resume_at ? ' · continues by itself at ' + hhmm(r.resume_at) : '') + '</p>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px"><button class="link small" style="color:var(--red)" data-act="delete" data-rid="' + esc(r.run_id) + '" data-title="' + esc(r.title) + '">Delete</button>' +
      '<span style="display:flex;gap:8px;flex-wrap:wrap">' + (r.status === 'done' ? '<a class="btn" href="#/delivery/' + esc(r.run_id) + '">Plan the lectures</a>' : '') +
      '<a class="btn' + (r.run_id === firstWait ? ' primary' : '') + '" href="#/run/' + esc(r.run_id) + '">' + (r.status === 'waiting' ? 'Review now' : 'Open') + ' ' + ICON.arrow + '</a></span></div></div>').join('')
    : '<div class="card center" style="padding:32px"><p class="muted">No courses yet.</p></div>';
  return header() + '<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>Your courses</h1></div>' +
    '<a class="btn' + (firstWait ? '' : ' primary') + '" href="#/new">New course</a></div>' + healthBanner() + list + '</div>';
}
function healthBanner() {
  if (!HEALTH) return '';
  if (HEALTH.kg_backend === 'neo4j' && !HEALTH.neo4j)
    return '<div class="banner red">' + ICON.alert + '<div><b style="font-weight:600">The course database (Neo4j) isn\'t running.</b> Open Neo4j Desktop and start the ProfsAgent database before starting a course. Runs that need it will wait with a "Try again" button.</div></div>';
  if (!HEALTH.keys.gemini && !HEALTH.keys.groq)
    return '<div class="banner red">' + ICON.alert + '<div><b style="font-weight:600">No AI keys found.</b> Add GEMINI_API_KEYS (and GROQ_API_KEYS) to the .env file, then restart the app.</div></div>';
  return '';
}

// ============================== form ==============================
// Only the name and the description are required. Everything left blank is filled in by ProfsAgent first, and the
// professor checks the complete form (the "Details" step) before any design work starts.
const BLANK = () => ({ name: '', description: '', topics: '', topics_flexible: true, intent_question: '', intent_emphasis: '', intent_avoid: '',
  department: '', credits: '', l: '', t: '', p: '', weeks: '', weekly_effort: '', programmes: [], year: '', background: '',
  lab: '', lab_infra: '', assess_pref: [], assess_avoid: [], assess_why: '', special: '', external_research: true });
function saveDraft() { if (PAGE !== 'form') return; store.set('profsagent-draft', JSON.stringify(FORM)); }
const LEAVE = 'Leave blank: ProfsAgent fills it in';
// mode 'new': the professor's first form. mode 'review': the complete form after ProfsAgent filled the blanks;
// every suggested field shows why and where it came from, and everything stays editable.
function formCards(f, e, o, mode, filled) {
  filled = filled || {};
  const review = mode === 'review';
  const err = k => e[k] ? '<p class="err" data-err="' + k + '">' + esc(e[k]) + '</p>' : '';
  const ai = (...keys) => { const s = keys.map(k => filled[k]).filter(Boolean); if (!s.length) return '';
    const srcs = [].concat(...s.map(x => x.sources || [])).filter((x, i, a) => a.findIndex(y => y.text === x.text) === i);
    const fixes = s.map(x => x.corrected).filter(Boolean);
    return '<div class="ainote"><span class="chip teal">Filled in by ProfsAgent</span> ' + esc(s.map(x => x.reason).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(' ')) +
      (fixes.length ? '<div class="small" style="margin-top:3px;color:var(--amber)">' + fixes.map(esc).join('<br>') + '</div>' : '') +
      (srcs.length ? '<div class="tiny" style="margin-top:3px">Based on: ' + srcs.map(x => x.url ? ext(x.url, x.text) : esc(x.text)).join(' · ') + '</div>' : '') + '</div>'; };
  const cls = (...keys) => keys.some(k => filled[k]) ? ' class="aifield"' : '';
  const opt = review ? '' : ' <span class="opt">(optional)</span>';
  const tog = (key, v) => '<button type="button" class="tog' + (f[key].includes(v) ? ' on' : '') + '" data-tog="' + key + '" data-v="' + esc(v) + '" aria-pressed="' + f[key].includes(v) + '">' + esc(v) + '</button>';
  const sel = (key, vals, labels) => '<select data-f="' + key + '" id="' + key + '"' + cls(key) + '><option value="">' + (review ? 'Not set' : LEAVE) + '</option>' +
    vals.map((v, i) => '<option value="' + esc(v) + '"' + (f[key] === v ? ' selected' : '') + '>' + esc(labels ? labels[i] : v) + '</option>').join('') + '</select>';
  const txt = (key, ph, extra) => '<input type="text" id="' + key + '" data-f="' + key + '"' + cls(key) + ' value="' + esc(f[key]) + '" placeholder="' + esc(ph || '') + '"' + (extra || '') + '>';
  const area = (key, rows, ph) => '<textarea id="' + key + '" data-f="' + key + '"' + cls(key) + ' rows="' + rows + '" placeholder="' + esc(ph || '') + '">' + esc(f[key]) + '</textarea>';
  const ph = (x) => review ? '' : x;
  return '<div class="card"><h2>About the course</h2>' +
    '<label class="f" for="name" style="margin-top:0">Course name *</label>' + txt('name', 'Software Development using AI') + err('name') +
    '<label class="f" for="description">Short description *</label>' + area('description', 3, 'What the course is about and what students can do at the end (3–6 sentences)') + err('description') +
    '<label class="f" for="topics">Topics' + opt + '</label>' + area('topics', review ? 7 : 5, ph('A. AI-native development: AI-assisted coding, coding agents\nB. Engineering practice: automated testing, deployment')) + err('topics') + ai('topics') +
    '<label class="check small"><input type="checkbox" data-f="topics_flexible"' + (f.topics_flexible ? ' checked' : '') + '> ProfsAgent may change these topics</label></div>' +
    '<div class="card"><h2>Course intent</h2>' +
    '<label class="f" for="intent_question" style="margin-top:0">The central question the course answers' + opt + '</label>' + txt('intent_question', ph('How do you design, build and test a multi-component program?')) + ai('intent_question') +
    '<label class="f" for="intent_emphasis">Teaching emphasis' + opt + '</label>' + txt('intent_emphasis', ph('Design thinking before coding; learning by building')) + ai('intent_emphasis') +
    '<label class="f" for="intent_avoid">This course should NOT become <span class="opt">(one per line)</span></label>' + area('intent_avoid', 2, ph('A Java language features course')) + ai('intent_avoid') + '</div>' +
    '<div class="card"><h2>Structure</h2>' +
    '<div class="g3"><div><label class="f" for="department" style="margin-top:0">Proposing department</label>' + sel('department', o.departments) + err('department') + '</div>' +
    '<div><label class="f" for="credits" style="margin-top:0">Credits</label>' + sel('credits', o.credits) + err('credits') + '</div>' +
    '<div><label class="f" for="weeks" style="margin-top:0">Teaching weeks</label>' + txt('weeks', ph('e.g. 13')) + err('weeks') + '</div></div>' + ai('department', 'credits', 'weeks') +
    '<label class="f">Hours per week: lecture – tutorial – lab</label><div style="display:flex;gap:6px;max-width:260px">' +
    ['l', 't', 'p'].map((k, i) => '<input type="text" aria-label="' + ['Lecture', 'Tutorial', 'Lab'][i] + ' hours" data-f="' + k + '"' + cls(k) + ' value="' + esc(f[k]) + '" placeholder="' + (review ? '' : ['L, e.g. 3', 'T, e.g. 1', 'P, e.g. 0'][i]) + '">').join('') + '</div>' + err('ltp') + ai('l', 't', 'p') +
    '<label class="f" for="weekly_effort">Student work outside lectures, hours a week' + opt + '</label>' + txt('weekly_effort', ph('e.g. 10-12'), ' style="max-width:260px"') + ai('weekly_effort') +
    '</div>' +
    '<div class="card"><h2>Students</h2>' +
    '<label class="f" style="margin-top:0">Programmes' + opt + '</label><div class="chips">' + o.programmes.map(v => tog('programmes', v)).join('') + '</div>' + err('programmes') + ai('programmes') +
    '<div class="g2"><div><label class="f" for="year">Year</label>' + sel('year', o.years) + err('year') + ai('year') + '</div>' +
    '<div><label class="f" for="background">Students should already know' + opt + '</label>' + txt('background', ph('CSE201 Advanced Programming; basic software engineering')) + '<div id="bglook"></div>' + ai('background') + '</div></div></div>' +
    '<div class="card"><h2>Lab and assessment</h2>' +
    '<div class="g2"><div><label class="f" for="lab" style="margin-top:0">Lab</label>' + sel('lab', ['weekly', 'none'], ['A lab every week', 'No lab']) + err('lab') + ai('lab') + '</div>' +
    '<div><label class="f" for="lab_infra" style="margin-top:0">Lab infrastructure' + opt + '</label>' + txt('lab_infra', ph('Students\' laptops, GPUs on the cluster, TA support')) + ai('lab_infra') + '</div></div>' +

async function dweeksGo() {
  const w = PUI.wk; w.busy = true; w.err = null; render();
  const r = await post(dapi('/weeks'), { weeks: w.weeks, material: w.material, resources: w.resources, ai_review: w.material && w.ai });
  w.busy = false;
  if (!r.ok) { w.err = (r.data && r.data.problem) || 'Could not start'; render(); return; }
  const s = r.data.started_slides.length, c = r.data.started_resources.length, sk = r.data.skipped.length;
  PUI.wk = null;
  toast((s || c ? 'Started: ' + [s ? 'slides for ' + s : '', c ? 'resources for ' + c : ''].filter(Boolean).join(', ') + ' lecture' + (s + c === 1 ? '' : 's') + '.'

}

    '<div class="chips" style="margin-top:6px">' + (l.novel && !mostlyNovel() ? '<span class="chip star">★ New topic</span>' : '') + (l.continues ? '<span class="chip grey">Continues in the next lecture</span>' : '') +

// ---------------------------------- S3: progress ----------------------------------
function dprogressCard(l) {
  const a = DV.survey[l.id], rows = [], j = djob(l.id), r = DV.results[l.id];
  if (yes(a, 'own_material')) rows.push(['Own material', '<span class="chip green">' + ICON.check + 'Covered</span>', '']);
  if (yes(a, 'attach_material')) rows.push(['Working with your material', '<span class="chip grey">Not connected yet</span>', 'Working with your files is not connected yet. Your files and tasks are saved for it.']);
  if (yes(a, 'generate_material')) {
    const mj = dmatJob(l.id), m = (DV.material || {})[l.id], mlab = 'Making slides and notes';
    const mlast = ((DV.log || {})[l.id] || []).filter(x => /lecture material|slides:/.test(x)).slice(-1)[0] || '';
    if (mj && mj.state === 'running') rows.push([mlab, '<span class="spin" aria-hidden="true"></span>', 'Writing and checking the slides (about 2–3 minutes)…']);
    else if (mj && mj.state === 'queued') rows.push([mlab, '<span class="chip grey">Waiting to start</span>', 'Another job is running; this one starts after it.']);
    else if (mj && mj.state === 'error') rows.push([mlab, '<span class="chip red">Stopped</span>', esc(mj.error) + ' <button class="btn sm" data-act="d-mgen">Generate again</button>']);
    else if (m) rows.push([mlab, '<span class="chip green">' + ICON.check + 'Done</span>', m.slides + ' slides · ' + m.errors + ' error' + (m.errors === 1 ? '' : 's') + ' · ' + m.warnings + ' warning' + (m.warnings === 1 ? '' : 's') + '. Review them under Results → Generated slides.']);
    else rows.push([mlab, '<span class="chip grey">Not started</span>', '<button class="btn sm primary" data-act="d-mgen">Generate the slides</button>']);
    if (mlast && mj && mj.state === 'running') rows[rows.length - 1][2] += ' <span class="tiny">' + esc(mlast.replace(/^\d\d:\d\d:\d\d\s+/, '')) + '</span>';
  }
  if (yes(a, 'assistance') || yes(a, 'guest_lecture')) {
    const label = [yes(a, 'assistance') ? 'Finding resources' : '', yes(a, 'guest_lecture') ? 'finding guest speakers' : ''].filter(Boolean).join(' and ').replace(/^./, x => x.toUpperCase());
    const last = ((DV.log || {})[l.id] || []).slice(-1)[0] || '';
    if (j && j.state === 'running') rows.push([label, '<span class="spin" aria-hidden="true"></span>', esc(last.replace(/^\d\d:\d\d:\d\d\s+/, '')) || 'Starting…']);
    else if (j && j.state === 'queued') rows.push([label, '<span class="chip grey">Waiting to start</span>', 'Another search is running; this one starts after it.']);
    else if (j && j.state === 'error') rows.push([label, '<span class="chip red">Stopped</span>', esc(j.error) + ' <button class="btn sm" data-act="d-start" data-refresh="0">Try again</button>']);
    else if (r && r.partial) rows.push([label, '<span class="chip amber">Partial</span>', esc(r.partial.reason || 'Some videos could not be checked against their transcripts') +
      '. Their coverage was judged from title and description. <button class="btn sm" data-act="d-start" data-refresh="0">Finish the search</button>']);
    else if (r) rows.push([label, '<span class="chip green">' + ICON.check + 'Done</span>', r.generated_at ? 'Last run ' + esc(String(r.generated_at).replace('T', ' ').slice(0, 16)) : '']);
    else rows.push([label, '<span class="chip grey">Not started</span>', '<button class="btn sm primary" data-act="d-start" data-refresh="0">Start the search</button>']);
  }
  const log = (DV.log || {})[l.id] || [];
  return '<div class="card"><h2>Progress</h2>' + rows.map(x => '<div class="prog"><span style="min-width:200px;font-weight:500">' + x[0] + '</span>' + x[1] + '<span class="small muted" style="flex:1">' + x[2] + '</span></div>').join('') +
    '<p class="tiny muted" style="margin-top:8px">Finding resources and speakers takes about 1.5–3 minutes per lecture. You can leave this page; the work continues.</p>' +
    (log.length ? '<details style="margin-top:8px"' + (PUI.logOpen[l.id] ? ' open' : '') + ' data-dlog="' + esc(l.id) + '"><summary>What the search did (technical log)</summary><pre class="log">' + esc(log.join('\n')) + '</pre></details>' : '') + '</div>';
}

// ---------------------------------- S4 / S5: results and review ----------------------------------
function dresultsCard(l) {
  const a = DV.survey[l.id], r = DV.results[l.id], j = djob(l.id), tabs = [];
  if (yes(a, 'own_material')) tabs.push(['own', 'My material']);
  if (yes(a, 'attach_material')) tabs.push(['attach', 'Attached material']);
  if (yes(a, 'generate_material') || (DV.material || {})[l.id]) tabs.push(['gen', 'Generated slides']);
  const hasPlan = (r && (r.components || []).length) || dmix(l.id);

function md(src) {
  const lines = src.split('\n'), out = []; let list = null, para = [];
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush = () => { if (para.length) { out.push('<p style="margin-top:8px">' + inline(para.join(' ')) + '</p>'); para = []; } if (list) { out.push('</' + list + '>'); list = null; } };
  lines.forEach(ln => {
    let m;
    if (/^#\s/.test(ln)) { flush(); out.push('<h1>' + inline(ln.slice(2)) + '</h1>'); }
    else if (/^##\s/.test(ln)) { flush(); out.push('<h2>' + inline(ln.slice(3)) + '</h2>'); }
    else if (/^###\s/.test(ln)) { flush(); out.push('<h3 style="margin-top:14px">' + inline(ln.slice(4)) + '</h3>'); }
    else if ((m = ln.match(/^\s*-\s+(.*)/))) { if (para.length) flush(); if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = ln.match(/^\d+\.\s+(.*)/))) { if (para.length) flush(); if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if (/^\s{2,}\S/.test(ln) && list) { out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, '<br><span class="small muted">' + inline(ln.trim()) + '</span></li>'); }
    else if (!ln.trim()) flush();
    else para.push(ln.trim());
  });
  flush(); return out.join('');
}

    store.set('profsagent-draft', ''); location.hash = '#/run/' + r.data.run_id; return;
  }
  if (a === 'stopopen') { UI.stopOpen = true; UI.err = ''; render(); const t = document.getElementById('stopwhy'); if (t) t.focus(); return; }
  if (a === 'stopcancel') { UI.stopOpen = false; UI.err = ''; render(); return; }
  if (a === 'approve' || a === 'reject') {
    const comment = a === 'reject' ? (UI.stopWhy || '') : (UI.comment || '');
    if (a === 'reject' && !comment.trim()) { UI.err = 'Say briefly why you are stopping'; render(); return; }
    if (a === 'approve' && RUN.problems && RUN.problems.blocked && !comment.trim()) { UI.err = 'Give a reason for continuing despite the open problems'; render(); return; }
    UI.sending = true; UI.err = ''; render();
    const body = { gate: RUN.gate, decision: a, comment };
    if (RUN.gate === 'gate0_details' && a === 'approve') body.values = FORM;
    const r = await post('/api/runs/' + encodeURIComponent(RID) + '/decision', body);
    UI.sending = false;
    if (r.status === 422) { ERRS = r.data.errors || {}; render(); const first = app.querySelector('.err'); if (first) first.scrollIntoView({ block: 'center' }); toast('Some details are still missing'); return; }
    if (!r.ok) { UI.err = (r.data && r.data.problem) || 'Could not send'; render(); return; }
    toast(a === 'approve' ? (RUN.gate === 'gate0_details' ? 'Details confirmed. ProfsAgent starts designing the course.' : 'Thanks. ProfsAgent continues with the next part.') : 'Stopped.'); window.scrollTo(0, 0); await loadRun(true); return;
  }
  if (a === 'retry') { const r = await post('/api/runs/' + encodeURIComponent(RID) + '/retry'); if (!r.ok) toast((r.data && r.data.problem) || 'Could not restart'); await loadRun(true); return; }
  if (a === 'proposal') { if (UI.proposal) { UI.proposal = null; render(); return; } const r = await api('/api/runs/' + encodeURIComponent(RID) + '/proposal'); UI.proposal = r.ok ? r.data.html : '<p class="err">Not available yet</p>'; render(); return; }
  if (a === 'again') { const r = await api('/api/runs/' + encodeURIComponent(RID) + '/form'); if (r.ok) { store.set('profsagent-draft', JSON.stringify(r.data)); location.hash = '#/new'; toast('The form is filled in from this run. Change what you need.'); } return; }
  if (a === 'rate') { UI.fb.ratings[b.dataset.k] = +b.dataset.n; render(); return; }
  if (a === 'fbagain') { UI.fb = { ratings: {}, change: '', time_saved: '' }; render(); return; }
  if (a === 'fbsend') {
    const r = await post('/api/runs/' + encodeURIComponent(RID) + '/feedback', { ratings: UI.fb.ratings, change: UI.fb.change, time_saved: UI.fb.time_saved, by: RUN.by });
    if (!r.ok) { UI.fb.err = (r.data && r.data.problem) || 'Could not save'; render(); return; }
    UI.fb = { ratings: {}, change: '', time_saved: '', sent: true }; render(); toast('Feedback saved. Thank you.'); return;
  }
});
route();
})();
</script>
</body>
